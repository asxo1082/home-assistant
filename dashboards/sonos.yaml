title: Sonos
views:
  - title: Sonos
    path: sonos
    icon: mdi:speaker-wireless
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-title-card
            title: Sonos
            subtitle: >-
              {% set n = expand(['media_player.wohnzimmer',
              'media_player.wohnzimmer_2', 'media_player.unnamed_room',
              'media_player.esszimmer', 'media_player.esszimmer_2',
              'media_player.gaste', 'media_player.og_flur']) |
              selectattr('state','eq','playing') | list | count %}{{ 'Es läuft
              nichts' if n == 0 else n ~ (' Lautsprecher spielt' if n == 1 else
              ' Lautsprecher spielen') }}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Alle starten
                icon: mdi:play-circle
                icon_color: green
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_play
                  target:
                    entity_id:
                      - media_player.wohnzimmer
                      - media_player.wohnzimmer_2
                      - media_player.unnamed_room
                      - media_player.esszimmer
                      - media_player.esszimmer_2
                      - media_player.gaste
                      - media_player.og_flur
                card_mod:
                  style: >-
                    ha-card { border-radius: 22px; border: none; min-height:
                    84px; background: linear-gradient(135deg,
                    rgba(76,175,80,.34), rgba(76,175,80,.08)); }
              - type: custom:mushroom-template-card
                primary: Alle pausieren
                icon: mdi:pause-circle
                icon_color: amber
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_pause
                  target:
                    entity_id:
                      - media_player.wohnzimmer
                      - media_player.wohnzimmer_2
                      - media_player.unnamed_room
                      - media_player.esszimmer
                      - media_player.esszimmer_2
                      - media_player.gaste
                      - media_player.og_flur
                card_mod:
                  style: >-
                    ha-card { border-radius: 22px; border: none; min-height:
                    84px; background: linear-gradient(135deg,
                    rgba(255,193,7,.34), rgba(255,193,7,.08)); }
              - type: custom:mushroom-template-card
                primary: Alle leiser
                icon: mdi:volume-minus
                icon_color: blue
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: media_player.volume_down
                  target:
                    entity_id:
                      - media_player.wohnzimmer
                      - media_player.wohnzimmer_2
                      - media_player.unnamed_room
                      - media_player.esszimmer
                      - media_player.esszimmer_2
                      - media_player.gaste
                      - media_player.og_flur
                card_mod:
                  style: >-
                    ha-card { border-radius: 22px; border: none; min-height:
                    84px; background: linear-gradient(135deg,
                    rgba(33,150,243,.34), rgba(33,150,243,.08)); }
              - type: custom:mushroom-template-card
                primary: Alle lauter
                icon: mdi:volume-plus
                icon_color: red
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: media_player.volume_up
                  target:
                    entity_id:
                      - media_player.wohnzimmer
                      - media_player.wohnzimmer_2
                      - media_player.unnamed_room
                      - media_player.esszimmer
                      - media_player.esszimmer_2
                      - media_player.gaste
                      - media_player.og_flur
                card_mod:
                  style: >-
                    ha-card { border-radius: 22px; border: none; min-height:
                    84px; background: linear-gradient(135deg,
                    rgba(244,67,54,.34), rgba(244,67,54,.08)); }
              - type: custom:mushroom-template-card
                primary: Alle gruppieren
                icon: mdi:link-variant
                icon_color: purple
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: media_player.join
                  target:
                    entity_id: media_player.wohnzimmer
                  data:
                    group_members:
                      - media_player.wohnzimmer_2
                      - media_player.unnamed_room
                      - media_player.esszimmer
                      - media_player.esszimmer_2
                      - media_player.gaste
                      - media_player.og_flur
                  confirmation:
                    text: Alle Lautsprecher mit dem Wohnzimmer verbinden?
                card_mod:
                  style: >-
                    ha-card { border-radius: 22px; border: none; min-height:
                    84px; background: linear-gradient(135deg,
                    rgba(156,39,176,.34), rgba(156,39,176,.08)); }
              - type: custom:mushroom-template-card
                primary: Gruppen auflösen
                icon: mdi:link-variant-off
                icon_color: grey
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: media_player.unjoin
                  target:
                    entity_id:
                      - media_player.wohnzimmer
                      - media_player.wohnzimmer_2
                      - media_player.unnamed_room
                      - media_player.esszimmer
                      - media_player.esszimmer_2
                      - media_player.gaste
                      - media_player.og_flur
                card_mod:
                  style: >-
                    ha-card { border-radius: 22px; border: none; min-height:
                    84px; background: linear-gradient(135deg,
                    rgba(120,144,156,.34), rgba(120,144,156,.08)); }
      - type: grid
        cards:
          - type: heading
            heading: Wohnzimmer (Arc)
            heading_style: title
            icon: mdi:television-speaker
            grid_options:
              columns: full
          - type: custom:mushroom-media-player-card
            entity: media_player.wohnzimmer
            use_media_info: true
            use_media_artwork: true
            show_volume_level: true
            volume_controls:
              - volume_mute
              - volume_set
              - volume_buttons
            media_controls:
              - previous
              - play_pause_stop
              - next
            collapsible_controls: false
            layout: vertical
            card_mod:
              style: |
                ha-card { border-radius: 22px; border: none; 
                  {% set s = states('media_player.wohnzimmer') %}
                  {% set rgb = '156,39,176' if s == 'playing' else ('63,81,181' if s == 'paused' else '120,144,156') %}
                  background: linear-gradient(135deg, rgba({{ rgb }},.34), rgba({{ rgb }},.08));
                  box-shadow: 0 4px 14px rgba({{ rgb }},.18); }
            grid_options:
              columns: full
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                entity: switch.wohnzimmer_night_sound
                icon: mdi:weather-night
                content: >-
                  Nachtton {{ 'an' if
                  is_state('switch.wohnzimmer_night_sound','on') else 'aus' }}
                icon_color: >-
                  {{ 'purple' if is_state('switch.wohnzimmer_night_sound','on')
                  else 'disabled' }}
                tap_action:
                  action: toggle
              - type: template
                entity: switch.wohnzimmer_speech_enhancement
                icon: mdi:account-voice
                content: >-
                  Sprache {{ 'an' if
                  is_state('switch.wohnzimmer_speech_enhancement','on') else
                  'aus' }}
                icon_color: >-
                  {{ 'purple' if
                  is_state('switch.wohnzimmer_speech_enhancement','on') else
                  'disabled' }}
                tap_action:
                  action: toggle
              - type: template
                entity: switch.wohnzimmer_subwoofer_enabled
                icon: mdi:speaker
                content: >-
                  Sub {{ 'an' if
                  is_state('switch.wohnzimmer_subwoofer_enabled','on') else
                  'aus' }}
                icon_color: >-
                  {{ 'purple' if
                  is_state('switch.wohnzimmer_subwoofer_enabled','on') else
                  'disabled' }}
                tap_action:
                  action: toggle
              - type: template
                entity: switch.wohnzimmer_loudness
                icon: mdi:volume-high
                content: >-
                  Loudness {{ 'an' if
                  is_state('switch.wohnzimmer_loudness','on') else 'aus' }}
                icon_color: >-
                  {{ 'purple' if is_state('switch.wohnzimmer_loudness','on')
                  else 'disabled' }}
                tap_action:
                  action: toggle
            grid_options:
              columns: full
