title: Reinigung
views:
  - title: Erdgeschoss
    path: eg
    icon: mdi:stairs-down
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Erdgeschoss – Roborock Q7 Max
            icon: mdi:robot-vacuum
          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                entity: vacuum.roborock_q7_max
                primary: Roborock Q7 Max
                secondary: >-
                  {% set z = states('vacuum.roborock_q7_max') %} {% set fl =
                  'sensor.roborock_q7_max_reinigungsbereich' %} {% set zt =
                  'sensor.roborock_q7_max_reinigungszeit' %} {% set fe =
                  states('sensor.roborock_q7_max_staubsauger_fehler') %} {{
                  {'cleaning': 'Reinigt', 'docked': 'In der Station',
                  'returning': 'Fährt zurück', 'paused': 'Pausiert', 'idle':
                  'Bereit', 'error': 'Fehler', 'unavailable': 'Nicht
                  erreichbar'}.get(z, z) }} · Batterie {{
                  states('sensor.roborock_q7_max_batterie') }} %{% if z ==
                  'cleaning' %} · {{ states(fl) }} {{ state_attr(fl,
                  'unit_of_measurement') or '' }} · {{ states(zt) }} {{
                  state_attr(zt, 'unit_of_measurement') or '' }}{% endif %}{% if
                  fe not in ['none', 'unknown', 'unavailable'] %} · Fehler: {{
                  fe }}{% endif %}
                multiline_secondary: true
                icon: mdi:robot-vacuum
                icon_color: >-
                  {% set z = states('vacuum.roborock_q7_max') %} {{ 'red' if z
                  == 'error' else ('blue' if z == 'cleaning' else ('green' if z
                  == 'docked' else ('amber' if z in ['returning', 'paused'] else
                  'disabled'))) }}
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 22px;
                      border: none;
                      {% set z = states('vacuum.roborock_q7_max') %}
                      {% if z == 'error' %}
                      background: linear-gradient(135deg, rgba(244,67,54,.35), rgba(244,67,54,.08));
                      {% elif z == 'cleaning' %}
                      background: linear-gradient(135deg, rgba(33,150,243,.34), rgba(33,150,243,.08));
                      {% elif z == 'docked' %}
                      background: linear-gradient(135deg, rgba(76,175,80,.24), rgba(76,175,80,.05));
                      {% elif z in ['returning', 'paused'] %}
                      background: linear-gradient(135deg, rgba(255,193,7,.30), rgba(255,193,7,.07));
                      {% else %}
                      background: linear-gradient(135deg, rgba(158,158,158,.20), rgba(158,158,158,.05));
                      {% endif %}
                    }
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Start
                    icon: mdi:play
                    icon_color: green
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.start
                      target:
                        entity_id: vacuum.roborock_q7_max
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; }
                  - type: custom:mushroom-template-card
                    primary: Pause
                    icon: mdi:pause
                    icon_color: amber
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.pause
                      target:
                        entity_id: vacuum.roborock_q7_max
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; }
                  - type: custom:mushroom-template-card
                    primary: Station
                    icon: mdi:home-import-outline
                    icon_color: blue
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.return_to_base
                      target:
                        entity_id: vacuum.roborock_q7_max
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; }
                  - type: custom:mushroom-template-card
                    primary: Suchen
                    icon: mdi:map-marker-radius
                    icon_color: purple
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.locate
                      target:
                        entity_id: vacuum.roborock_q7_max
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; }
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:repeat
                content: Alles 2x
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.roborock_q7_max_alles_2x
          - type: custom:mushroom-select-card
            entity: select.reinigung_roborock_q7_max_reinigungsmodus
            name: Reinigungsmodus
            icon: mdi:tune
          - type: tile
            entity: switch.roborock_q7_max_bitte_nicht_storen
            name: Bitte nicht stören
            icon: mdi:sleep
          - type: picture-entity
            entity: image.roborock_q7_max_map_1
            name: Karte
            show_name: true
            show_state: false
      - type: grid
        cards:
          - type: heading
            heading: Verbrauchsmaterial Roborock
            icon: mdi:wrench-clock
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Filter
                secondary: >-
                  {% set e = 'sensor.roborock_q7_max_verbleibende_filterzeit' %}
                  {% set v = states(e) | float(0) %} {% set u = state_attr(e,
                  'unit_of_measurement') or 'h' %} {% if states(e) in
                  ['unavailable', 'unknown'] %}Keine Daten{% elif v <= 0
                  %}Überfällig seit {{ v | abs | round(0) | int }} {{ u }}{%
                  else %}Noch {{ v | round(0) | int }} {{ u }}{% endif %}
                multiline_secondary: true
                icon: mdi:air-filter
                icon_color: >-
                  {% set v =
                  states('sensor.roborock_q7_max_verbleibende_filterzeit') |
                  float(0) %} {{ 'red' if v <= 0 else ('amber' if v < 50 else
                  'green') }}
                layout: vertical
                tap_action:
                  action: none
              - type: custom:mushroom-template-card
                primary: Hauptbürste
                secondary: >-
                  {% set e =
                  'sensor.roborock_q7_max_verbleibende_zeit_der_hauptburste' %}
                  {% set v = states(e) | float(0) %} {% set u = state_attr(e,
                  'unit_of_measurement') or 'h' %} {% if states(e) in
                  ['unavailable', 'unknown'] %}Keine Daten{% elif v <= 0
                  %}Überfällig seit {{ v | abs | round(0) | int }} {{ u }}{%
                  else %}Noch {{ v | round(0) | int }} {{ u }}{% endif %}
                multiline_secondary: true
                icon: mdi:brush
                icon_color: >-
                  {% set v =
                  states('sensor.roborock_q7_max_verbleibende_zeit_der_hauptburste')
                  | float(0) %} {{ 'red' if v <= 0 else ('amber' if v < 50 else
                  'green') }}
                layout: vertical
                tap_action:
                  action: none
              - type: custom:mushroom-template-card
                primary: Seitenbürste
                secondary: >-
                  {% set e =
                  'sensor.roborock_q7_max_verbleibende_zeit_der_seitenburste' %}
                  {% set v = states(e) | float(0) %} {% set u = state_attr(e,
                  'unit_of_measurement') or 'h' %} {% if states(e) in
                  ['unavailable', 'unknown'] %}Keine Daten{% elif v <= 0
                  %}Überfällig seit {{ v | abs | round(0) | int }} {{ u }}{%
                  else %}Noch {{ v | round(0) | int }} {{ u }}{% endif %}
                multiline_secondary: true
                icon: mdi:brush-variant
                icon_color: >-
                  {% set v =
                  states('sensor.roborock_q7_max_verbleibende_zeit_der_seitenburste')
                  | float(0) %} {{ 'red' if v <= 0 else ('amber' if v < 50 else
                  'green') }}
                layout: vertical
                tap_action:
                  action: none
              - type: custom:mushroom-template-card
                primary: Sensoren
                secondary: >-
                  {% set e = 'sensor.roborock_q7_max_verbleibende_sensorzeit' %}
                  {% set v = states(e) | float(0) %} {% set u = state_attr(e,
                  'unit_of_measurement') or 'h' %} {% if states(e) in
                  ['unavailable', 'unknown'] %}Keine Daten{% elif v <= 0
                  %}Überfällig seit {{ v | abs | round(0) | int }} {{ u }}{%
                  else %}Noch {{ v | round(0) | int }} {{ u }}{% endif %}
                multiline_secondary: true
                icon: mdi:radar
                icon_color: >-
                  {% set v =
                  states('sensor.roborock_q7_max_verbleibende_sensorzeit') |
                  float(0) %} {{ 'red' if v <= 0 else ('amber' if v < 50 else
                  'green') }}
                layout: vertical
                tap_action:
                  action: none
      - type: grid
        cards:
          - type: heading
            heading: Statistik Roborock
            icon: mdi:chart-box
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.roborock_q7_max_gesamtzahl_reinigungen
                name: Reinigungen gesamt
                icon: mdi:counter
              - type: tile
                entity: sensor.roborock_q7_max_gesamtreinigungszeit
                name: Reinigungszeit gesamt
                icon: mdi:timer-outline
              - type: tile
                entity: sensor.roborock_q7_max_gesamter_reinigungsbereich
                name: Fläche gesamt
                icon: mdi:texture-box
              - type: tile
                entity: sensor.roborock_q7_max_letztes_reinigungsende
                name: Zuletzt fertig
                icon: mdi:clock-check-outline
  - title: Obergeschoss
    path: og
    icon: mdi:stairs-up
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Obergeschoss – TIKOM
            icon: mdi:robot-vacuum
          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                entity: vacuum.robot
                primary: TIKOM
                secondary: >-
                  {% set z = states('vacuum.robot') %} {% set fl =
                  'sensor.robot_reinigungsbereich' %} {% set zt =
                  'sensor.robot_reinigungszeit' %} {% set mins =
                  ((now().timestamp() -
                  as_timestamp(states.vacuum.robot.last_updated)) / 60) | int %}
                  {% if mins < 60 %}{% set alter = mins ~ ' Min' %}{% elif mins
                  < 1440 %}{% set alter = (mins // 60) ~ ' Std' %}{% else %}{%
                  set alter = (mins // 1440) ~ ' Tg' %}{% endif %} {% set
                  veraltet = z in ['cleaning', 'returning', 'paused'] and mins >
                  30 %} {{ {'cleaning': 'Reinigt', 'docked': 'In der Station',
                  'returning': 'Fährt zurück', 'paused': 'Pausiert', 'idle':
                  'Bereit', 'error': 'Fehler', 'unavailable': 'Nicht
                  erreichbar'}.get(z, z) }} · Batterie {{
                  states('sensor.robot_batterie') }} % · Reinigung: {{
                  states(fl) }} {{ state_attr(fl, 'unit_of_measurement') or ''
                  }} · {{ states(zt) }} {{ state_attr(zt, 'unit_of_measurement')
                  or '' }} · Stand: vor {{ alter }}{% if veraltet %} · ⚠️ keine
                  Meldung seit {{ alter }}{% endif %}
                multiline_secondary: true
                icon: mdi:robot-vacuum
                icon_color: >-
                  {% set z = states('vacuum.robot') %} {% set mins =
                  ((now().timestamp() -
                  as_timestamp(states.vacuum.robot.last_updated)) / 60) | int %}
                  {% set veraltet = z in ['cleaning', 'returning', 'paused'] and
                  mins > 30 %} {{ 'grey' if veraltet else ('red' if z == 'error'
                  else ('blue' if z == 'cleaning' else ('green' if z == 'docked'
                  else ('amber' if z in ['returning', 'paused'] else
                  'disabled')))) }}
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 22px;
                      border: none;
                      {% set z = states('vacuum.robot') %}
                      {% set mins = ((now().timestamp() - as_timestamp(states.vacuum.robot.last_updated)) / 60) | int %}
                      {% set veraltet = z in ['cleaning', 'returning', 'paused'] and mins > 30 %}
                      {% if veraltet %}
                      background: linear-gradient(135deg, rgba(158,158,158,.28), rgba(158,158,158,.06));
                      {% elif z == 'error' %}
                      background: linear-gradient(135deg, rgba(244,67,54,.35), rgba(244,67,54,.08));
                      {% elif z == 'cleaning' %}
                      background: linear-gradient(135deg, rgba(33,150,243,.34), rgba(33,150,243,.08));
                      {% elif z == 'docked' %}
                      background: linear-gradient(135deg, rgba(76,175,80,.24), rgba(76,175,80,.05));
                      {% elif z in ['returning', 'paused'] %}
                      background: linear-gradient(135deg, rgba(255,193,7,.30), rgba(255,193,7,.07));
                      {% else %}
                      background: linear-gradient(135deg, rgba(158,158,158,.20), rgba(158,158,158,.05));
                      {% endif %}
                    }
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Start
                    icon: mdi:play
                    icon_color: green
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.start
                      target:
                        entity_id: vacuum.robot
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; }
                  - type: custom:mushroom-template-card
                    primary: Pause
                    icon: mdi:pause
                    icon_color: amber
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.pause
                      target:
                        entity_id: vacuum.robot
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; }
                  - type: custom:mushroom-template-card
                    primary: Station
                    icon: mdi:home-import-outline
                    icon_color: blue
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.return_to_base
                      target:
                        entity_id: vacuum.robot
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; }
                  - type: custom:mushroom-template-card
                    primary: Suchen
                    icon: mdi:map-marker-radius
                    icon_color: purple
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: vacuum.locate
                      target:
                        entity_id: vacuum.robot
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; }
          - type: custom:mushroom-select-card
            entity: select.robot_modus
            name: Modus
            icon: mdi:tune
          - type: custom:mushroom-select-card
            entity: select.robot_einstellung_des_wassertanks
            name: Wassertank
            icon: mdi:water
          - type: tile
            entity: switch.robot_bitte_nicht_storen
            name: Bitte nicht stören
            icon: mdi:sleep
      - type: grid
        cards:
          - type: heading
            heading: Verbrauchsmaterial TIKOM
            icon: mdi:wrench-clock
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Filter
                secondary: >-
                  {% set e = 'sensor.robot_lebensdauer_des_filters' %} {% set u
                  = state_attr(e, 'unit_of_measurement') or '%' %} {% if
                  states(e) in ['unavailable', 'unknown'] %}Keine Daten{% else
                  %}{{ states(e) | float(0) | round(0) | int }} {{ u }} übrig{%
                  endif %}
                multiline_secondary: true
                icon: mdi:air-filter
                icon_color: >-
                  {% set v = states('sensor.robot_lebensdauer_des_filters') |
                  float(0) %} {{ 'red' if v <= 10 else ('amber' if v <= 30 else
                  'green') }}
                layout: vertical
                tap_action:
                  action: none
              - type: custom:mushroom-template-card
                primary: Seitenbürste
                secondary: >-
                  {% set e = 'sensor.robot_lebensdauer_der_seitenburste' %} {%
                  set u = state_attr(e, 'unit_of_measurement') or '%' %} {% if
                  states(e) in ['unavailable', 'unknown'] %}Keine Daten{% else
                  %}{{ states(e) | float(0) | round(0) | int }} {{ u }} übrig{%
                  endif %}
                multiline_secondary: true
                icon: mdi:brush-variant
                icon_color: >-
                  {% set v = states('sensor.robot_lebensdauer_der_seitenburste')
                  | float(0) %} {{ 'red' if v <= 10 else ('amber' if v <= 30
                  else 'green') }}
                layout: vertical
                tap_action:
                  action: none
              - type: custom:mushroom-template-card
                primary: Rollbürste
                secondary: >-
                  {% set e = 'sensor.robot_lebensdauer_der_rollburste' %} {% set
                  u = state_attr(e, 'unit_of_measurement') or '%' %} {% if
                  states(e) in ['unavailable', 'unknown'] %}Keine Daten{% else
                  %}{{ states(e) | float(0) | round(0) | int }} {{ u }} übrig{%
                  endif %}
                multiline_secondary: true
                icon: mdi:brush
                icon_color: >-
                  {% set v = states('sensor.robot_lebensdauer_der_rollburste') |
                  float(0) %} {{ 'red' if v <= 10 else ('amber' if v <= 30 else
                  'green') }}
                layout: vertical
                tap_action:
                  action: none
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:backup-restore
                content: Filter neu
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.robot_filter_zurucksetzen
                  confirmation:
                    text: >-
                      Filter-Zähler des TIKOM-Roboters zurücksetzen? Nur nach
                      dem Austausch.
              - type: template
                icon: mdi:backup-restore
                content: Seitenbürste neu
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.robot_kantenburste_zurucksetzen
                  confirmation:
                    text: >-
                      Seitenbürsten-Zähler des TIKOM-Roboters zurücksetzen? Nur
                      nach dem Austausch.
              - type: template
                icon: mdi:backup-restore
                content: Rollbürste neu
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.robot_rollburste_zurucksetzen
                  confirmation:
                    text: >-
                      Rollbürsten-Zähler des TIKOM-Roboters zurücksetzen? Nur
                      nach dem Austausch.
      - type: grid
        cards:
          - type: heading
            heading: Statistik TIKOM
            icon: mdi:chart-box
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.robot_gesamtreinigungszeiten
                name: Reinigungen gesamt
                icon: mdi:counter
              - type: tile
                entity: sensor.robot_gesamtreinigungszeit
                name: Reinigungszeit gesamt
                icon: mdi:timer-outline
              - type: tile
                entity: sensor.robot_gesamter_reinigungsbereich
                name: Fläche gesamt
                icon: mdi:texture-box
