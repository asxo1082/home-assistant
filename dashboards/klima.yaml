title: Klima
views:
  - title: Klima
    path: klima
    icon: mdi:air-conditioner
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Klimaanlagen
            icon: mdi:air-conditioner
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:power
                content: Alle aus
                tap_action:
                  action: perform-action
                  perform_action: climate.turn_off
                  target:
                    entity_id:
                      - climate.wf_rac_71fb
                      - climate.wf_rac_9707
                  confirmation:
                    text: Beide Klimaanlagen ausschalten?
            grid_options:
              columns: 24
              rows: 1
      - type: grid
        cards:
          - type: heading
            heading: Schlafzimmer
            icon: mdi:bed
          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('climate.wf_rac_71fb','current_temperature') |
              float(0) | round(1) | string | replace('.', ',') }} °C
            secondary: >-
              {% set s = states('climate.wf_rac_71fb') %} {{
              {'off':'Aus','cool':'Kühlen','heat':'Heizen','auto':'Auto','dry':'Entfeuchten','fan_only':'Lüften','unavailable':'Nicht
              erreichbar'}.get(s, s) }} · Soll {{
              state_attr('climate.wf_rac_71fb','temperature') | float(0) |
              round(1) | string | replace('.', ',') }} °C
            icon: mdi:air-conditioner
            icon_color: >-
              {% set s = states('climate.wf_rac_71fb') %} {{ 'red' if s ==
              'heat' else ('blue' if s == 'cool' else ('teal' if s in
              ['dry','fan_only'] else ('green' if s == 'auto' else ('red' if s
              == 'unavailable' else 'disabled')))) }}
            layout: vertical
            fill_container: true
            tap_action:
              action: none
            card_mod:
              style: |
                ha-card {
                  --card-primary-font-size: 38px;
                  --card-primary-font-weight: 600;
                  --card-secondary-font-size: 15px;
                  text-align: center;
                  padding: 12px 0;
                }
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: climate.wf_rac_71fb
            name: Steuerung
            icon: mdi:tune-variant
            hide_state: true
            vertical: false
            features_position: bottom
            features:
              - type: climate-hvac-modes
                style: icons
                hvac_modes:
                  - 'off'
                  - auto
                  - cool
                  - heat
                  - dry
                  - fan_only
              - type: target-temperature
            grid_options:
              columns: 12
              rows: 3
          - type: heading
            heading: Solltemperatur
            heading_style: subtitle
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: 18°
                secondary: >-
                  {{ 'Aktiv' if (not is_state('climate.wf_rac_71fb','off') and
                  state_attr('climate.wf_rac_71fb','temperature') | float(0) ==
                  18) else '' }}
                icon: mdi:snowflake
                icon_color: blue
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: climate.set_temperature
                  target:
                    entity_id: climate.wf_rac_71fb
                  data:
                    temperature: 18
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      --card-primary-font-size: 20px;
                      --card-primary-font-weight: 700;
                      --card-secondary-font-size: 11px;
                      {% if (not is_state('climate.wf_rac_71fb','off') and state_attr('climate.wf_rac_71fb','temperature') | float(0) == 18) %}
                      border: 3px solid rgb(33,150,243);
                      background: linear-gradient(160deg, rgba(33,150,243,.55), rgba(33,150,243,.15));
                      {% else %}
                      border: none;
                      background: linear-gradient(160deg, rgba(33,150,243,.22), rgba(33,150,243,.05));
                      {% endif %}
                    }
              - type: custom:mushroom-template-card
                primary: 20°
                secondary: >-
                  {{ 'Aktiv' if (not is_state('climate.wf_rac_71fb','off') and
                  state_attr('climate.wf_rac_71fb','temperature') | float(0) ==
