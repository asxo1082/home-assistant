                icon: mdi:thermometer-low
                icon_color: cyan
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: climate.set_temperature
                  target:
                    entity_id: climate.wf_rac_71fb
                  data:
                    temperature: 20
                card_mod:
