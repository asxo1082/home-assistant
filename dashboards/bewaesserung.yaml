                      {% endif %}
                    }
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: template
                    icon: mdi:play
                    content: An + Pumpe
                    tap_action:
                      action: perform-action
                      perform_action: script.bewasserung_an
                      data:
                        zone: switch.shellyplug_s_dddecc
                    icon_color: green
                  - type: template
                    icon: mdi:hand-back-right
                    content: An manuell
                    tap_action:
                      action: perform-action
                      perform_action: switch.turn_on
                      target:
                        entity_id: switch.shellyplug_s_dddecc
                    icon_color: orange
                  - type: template
                    icon: mdi:timer-outline
                    content: 15 min
                    tap_action:
                      action: perform-action
                      perform_action: script.bewasserung_zeit
                      data:
