            cards:
              - type: custom:mushroom-template-card
                primary: Tropf Garten
                secondary: >-
                  {% if is_state('switch.shellyplug_s_dddecc', 'on') %}läuft ·
                  {{ states('sensor.shellyplug_s_dddecc_leistung') | float(0) |
                  round(0) }} W{% else %}aus · bereit (Pumpe startet
