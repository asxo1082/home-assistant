                    icon_color: blue
                  - type: template
                    icon: mdi:timer-outline
                    content: 30 min
                    tap_action:
                      action: perform-action
                      perform_action: script.bewasserung_zeit
                      data:
                        zone: switch.tropf_vorgarten
                        minuten: 30
                    icon_color: blue
                  - type: template
                    icon: mdi:timer-outline
                    content: 60 min
                    tap_action:
                      action: perform-action
                      perform_action: script.bewasserung_zeit
                      data:
                        zone: switch.tropf_vorgarten
                        minuten: 60
                    icon_color: blue
                  - type: template
                    icon: mdi:stop
                    content: Aus
                    tap_action:
                      action: perform-action
                      perform_action: switch.turn_off
                      target:
                        entity_id: switch.tropf_vorgarten
                    icon_color: red
            card_mod:
              style: |
                ha-card { opacity: 1; }
          - type: vertical-stack
            grid_options:
