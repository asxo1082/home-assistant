title: Räume
views:
  - title: Zuhause
    path: zuhause
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: >-
              {% set h = now().hour %} {% if h < 5 or h >= 22 %}{% set g, e =
              'Gute Nacht', '🌙' %} {% elif h < 10 %}{% set g, e = 'Guten
              Morgen', '☀️' %} {% elif h < 14 %}{% set g, e = 'Guten Tag', '👋'
              %} {% elif h < 18 %}{% set g, e = 'Schönen Nachmittag', '☕' %} {%
              else %}{% set g, e = 'Guten Abend', '🌆' %}{% endif %} {{ g }} {{
              (user.split('.')[0].split(' ')[0] | capitalize) if user else
              'Familie Seelen' }}
            subtitle: >-
              {% set tage =
              ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag']
              %} {% set monate =
              ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']
              %} {% set w = 'weather.forecast_home' %} {% set wetter =
              {'sunny':'sonnig','clear-night':'klar','partlycloudy':'teils
              bewölkt','cloudy':'bewölkt',
                 'rainy':'Regen','pouring':'Starkregen','fog':'Nebel','snowy':'Schnee','snowy-rainy':'Schneeregen',
                 'windy':'windig','windy-variant':'windig','lightning':'Gewitter','lightning-rainy':'Gewitter','hail':'Hagel'} %}
              {{ tage[now().weekday()] }}, {{ now().day }}. {{
              monate[now().month - 1] }} {%- if states(w) not in ['unknown',
              'unavailable'] %} · {{ state_attr(w, 'temperature') | float(0) |
              round(0) | int }} °C, {{ wetter.get(states(w), states(w)) }}{%
              endif %}
          - type: custom:mushroom-template-card
            primary: >-
              {% set z = states('alarm_control_panel.alpen_alarm') %}
              Alarmanlage: {{ {'disarmed': 'Inaktiv', 'armed_home': 'Zuhause',
              'armed_away': 'Abwesend', 'arming': 'Wird scharf …', 'pending':
              'Eingangsverzögerung', 'triggered': 'ALARM!', 'unavailable':
              'Nicht erreichbar', 'unknown': 'Unbekannt'}.get(z, z) }}
            secondary: >-
              {% set z = states('alarm_control_panel.alpen_alarm') %} {{ 'Tippen
              für Details' if z not in ['triggered'] else 'Sofort prüfen!' }}
            icon: >-
              {% set z = states('alarm_control_panel.alpen_alarm') %} {{
              {'disarmed': 'mdi:shield-off', 'armed_home': 'mdi:shield-home',
              'armed_away': 'mdi:shield-lock', 'triggered':
              'mdi:shield-alert'}.get(z, 'mdi:shield') }}
            icon_color: >-
              {% set z = states('alarm_control_panel.alpen_alarm') %} {{
              {'disarmed': 'blue', 'armed_home': 'red', 'armed_away': 'purple',
              'triggered': 'red', 'arming': 'amber', 'pending': 'amber'}.get(z,
              'grey') }}
            layout: horizontal
            fill_container: true
            tap_action:
              action: more-info
              entity: alarm_control_panel.alpen_alarm
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  border-radius: 22px;
                  --card-primary-font-size: 15px;
                  --card-secondary-font-size: 12px;
                  {% set z = states('alarm_control_panel.alpen_alarm') %}
                  {% if z == 'triggered' %}
                  border: 3px solid var(--red-color);
                  background: linear-gradient(135deg, rgba(244,67,54,.55), rgba(244,67,54,.15));
                  {% elif z == 'armed_home' %}
                  border: 3px solid var(--red-color);
                  background: linear-gradient(135deg, rgba(244,67,54,.30), rgba(244,67,54,.07));
                  {% elif z == 'armed_away' %}
                  border: 3px solid var(--purple-color);
                  background: linear-gradient(135deg, rgba(156,39,176,.34), rgba(156,39,176,.08));
                  {% elif z == 'disarmed' %}
                  border: 3px solid var(--blue-color);
                  background: linear-gradient(135deg, rgba(33,150,243,.26), rgba(33,150,243,.06));
                  {% elif z in ['arming', 'pending'] %}
                  border: 3px solid var(--amber-color);
                  background: linear-gradient(135deg, rgba(255,193,7,.30), rgba(255,193,7,.07));
                  {% else %}
                  border: 3px solid var(--grey-color);
                  background: linear-gradient(135deg, rgba(158,158,158,.20), rgba(158,158,158,.05));
                  {% endif %}
                }
          - type: heading
            heading: Was liegt an?
            icon: mdi:bell-ring-outline
            heading_style: subtitle
          - type: custom:mushroom-template-card
            primary: >-
              {% set ns = namespace(w=0) %} {% for s in states.binary_sensor if
              s.attributes.get('device_class') in
              ['window','door','garage_door','opening'] and s.state == 'on' %}{%
              set ns.w = ns.w + 1 %}{% endfor %} {% set alarm =
              states('alarm_control_panel.alpen_alarm') %} {% if alarm ==
              'triggered' or
              is_state('binary_sensor.co2_melder_wohnzimmer_rauch','on') or
              is_state('binary_sensor.wasssermelder_uberflutung','on') %}🚨
              Achtung! {% elif ns.w or
              is_state('cover.smart_garage_door_2006048876520336100248e1e91e491b_garage','open')
              %}Bitte prüfen {% else %}Alles im grünen Bereich{% endif %}
            secondary: >-
              {% from 'schule.jinja' import frei, naechster_schultag, schulende,
              mitbringen, tagname %} {% set ns = namespace(l=[], offen=[]) %} {%
              set h = now().hour %} {% if
              is_state('binary_sensor.co2_melder_wohnzimmer_rauch','on') %}{%
              set ns.l = ns.l + ['🔥 RAUCHALARM im Wohnzimmer!'] %}{% endif %}
              {% if is_state('binary_sensor.wasssermelder_uberflutung','on')
              %}{% set ns.l = ns.l + ['💧 Wassermelder schlägt an!'] %}{% endif
              %} {% if is_state('alarm_control_panel.alpen_alarm','triggered')
              %}{% set ns.l = ns.l + ['🚨 Alarmanlage ausgelöst!'] %}{% endif %}
              {% set f = frei(now().strftime('%Y-%m-%d')) | trim %} {% set n =
              naechster_schultag() | trim %} {% set nd = as_datetime(n) %} {%
              set morgen = (now() + timedelta(days=1)).strftime('%Y-%m-%d') == n
              %} {% if f and f != 'Wochenende' %}{% set ns.l = ns.l + ['🎒 ' ~ f
              ~ ' – Schule wieder ab ' ~ tagname(nd.weekday()) ~ ', ' ~
              nd.strftime('%d.%m.')] %} {% elif not f and
              now().strftime('%H:%M') < schulende(now().weekday()) %}{% set ns.l
              = ns.l + ['🎒 Schule heute bis ' ~ schulende(now().weekday()) ~ '
              Uhr'] %}{% endif %} {% set t = mitbringen(nd.weekday()) | trim %}
              {% if morgen and t and h >= 12 %}{% set ns.l = ns.l + ['🧳 Für
              morgen: ' ~ t] %}{% endif %} {% set mm =
              state_attr('sensor.mull_nachste_abfuhr','morgen') %}{% set mh =
              state_attr('sensor.mull_nachste_abfuhr','heute') %}{% if mh and h
              < 10 %}{% set ns.l = ns.l + ['🗑️ Heute Abfuhr: ' ~ mh] %}{% elif
              mm and h >= 12 %}{% set ns.l = ns.l + ['🗑️ Morgen raus: ' ~ mm]
              %}{% endif %} {% for s in states.binary_sensor if
              s.attributes.get('device_class') in
              ['window','door','garage_door','opening'] and s.state == 'on' %}{%
              set ns.offen = ns.offen + [s.name | replace('Sensor ', '')] %}{%
              endfor %} {% if ns.offen %}{% set ns.l = ns.l + ['🪟 Offen: ' ~
              ns.offen | join(', ')] %}{% endif %} {% if
              is_state('cover.smart_garage_door_2006048876520336100248e1e91e491b_garage','open')
              %}{% set ns.l = ns.l + ['🚗 Garagentor ist offen'] %}{% endif %}
              {% set lampen =
              expand(['light.gastewc','light.shelly_stehlampe_gross','light.shelly_stehlampe_gross_2','switch.shelly2pmg3_8cbfea97b4e0_output_0','switch.shelly2pmg3_8cbfea97b4e0_output_1','light.kinderzimmer'])
              | selectattr('state','eq','on') | list | count %} {% if lampen and
              (h >= 23 or h < 6) %}{% set ns.l = ns.l + ['💡 Innen noch ' ~
              lampen ~ (' Lampe an' if lampen == 1 else ' Lampen an')] %}{%
              endif %} {% if
              is_state('alarm_control_panel.alpen_alarm','disarmed') and (h >=
              22 or h < 5) %}{% set ns.l = ns.l + ['🛡️ Alarm noch inaktiv –
              Gute Nacht vergessen?'] %}{% endif %} {{ ns.l | join('\n') if ns.l
              else '✅ Nichts Besonderes – genieß den Tag' }}
            multiline_secondary: true
            icon: >-
              {% set ns = namespace(w=0) %} {% for s in states.binary_sensor if
              s.attributes.get('device_class') in
              ['window','door','garage_door','opening'] and s.state == 'on' %}{%
              set ns.w = ns.w + 1 %}{% endfor %} {% if
              is_state('alarm_control_panel.alpen_alarm','triggered') or
              is_state('binary_sensor.co2_melder_wohnzimmer_rauch','on') or
              is_state('binary_sensor.wasssermelder_uberflutung','on')
              %}mdi:alert {% elif ns.w or
              is_state('cover.smart_garage_door_2006048876520336100248e1e91e491b_garage','open')
              %}mdi:clipboard-alert-outline {% else
              %}mdi:clipboard-check-outline{% endif %}
            icon_color: >-
              {% set ns = namespace(w=0) %} {% for s in states.binary_sensor if
              s.attributes.get('device_class') in
              ['window','door','garage_door','opening'] and s.state == 'on' %}{%
              set ns.w = ns.w + 1 %}{% endfor %} {% if
              is_state('alarm_control_panel.alpen_alarm','triggered') or
              is_state('binary_sensor.co2_melder_wohnzimmer_rauch','on') or
              is_state('binary_sensor.wasssermelder_uberflutung','on') %}red {%
              elif ns.w or
              is_state('cover.smart_garage_door_2006048876520336100248e1e91e491b_garage','open')
              %}orange {% else %}green{% endif %}
            tap_action:
              action: none
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  border-radius: 22px;
                  border: none;
                  --card-secondary-font-size: 13px;
                  --card-primary-font-size: 14px;
                  {% set ns = namespace(w=0) %}
                  {% for s in states.binary_sensor if s.attributes.get('device_class') in ['window','door','garage_door','opening'] and s.state == 'on' %}{% set ns.w = ns.w + 1 %}{% endfor %}
                  {% if is_state('alarm_control_panel.alpen_alarm','triggered') or is_state('binary_sensor.co2_melder_wohnzimmer_rauch','on') or is_state('binary_sensor.wasssermelder_uberflutung','on') %}{% set rgb = '244,67,54' %}
                  {% elif ns.w or is_state('cover.smart_garage_door_2006048876520336100248e1e91e491b_garage','open') %}{% set rgb = '255,152,0' %}
                  {% else %}{% set rgb = '76,175,80' %}{% endif %}
                  background: linear-gradient(135deg, rgba({{ rgb }},.28), rgba({{ rgb }},.06));
                }
          - type: heading
            heading: Termine
            icon: mdi:calendar
            heading_style: subtitle
          - type: custom:mushroom-template-card
            primary: Termine
            secondary: '{{ state_attr(''sensor.termine_woche'',''text'') }}'
            multiline_secondary: true
            icon: mdi:calendar
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: /calendar
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  border-radius: 22px;
                  border: none;
                  background: linear-gradient(135deg, rgba(33,150,243,.25), rgba(33,150,243,.06));
                  --card-secondary-font-size: 13px;
                  --card-primary-font-size: 14px;
                }
          - type: heading
            heading: Müllabfuhr
            icon: mdi:trash-can-outline
            heading_style: subtitle
          - type: custom:mushroom-template-card
            primary: >-
              {% set m = state_attr('sensor.mull_nachste_abfuhr', 'morgen') %}
              {% set h = state_attr('sensor.mull_nachste_abfuhr', 'heute') %} {{
              'Heute Abfuhr: ' ~ h if h else ('Morgen raus: ' ~ m if m else
              'Müllabfuhr') }}
            secondary: '{{ state_attr(''sensor.mull_nachste_abfuhr'', ''text'') }}'
            multiline_secondary: true
            icon: mdi:trash-can
            icon_color: >-
              {{ 'orange' if states('sensor.mull_nachste_abfuhr') | int(9) <= 1
              else 'green' }}
            tap_action:
              action: navigate
              navigation_path: /calendar
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  border-radius: 22px;
                  border: none;
                  {% set rgb = '255,152,0' if states('sensor.mull_nachste_abfuhr') | int(9) <= 1 else '76,175,80' %}
                  background: linear-gradient(135deg, rgba({{ rgb }},.26), rgba({{ rgb }},.06));
                  --card-secondary-font-size: 13px;
                  --card-primary-font-size: 14px;
                }
          - type: heading
            heading: Schnellaktionen
            heading_style: subtitle
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Guten Morgen
                secondary: Alarm aus · Licht aus · Rollos hoch
                multiline_secondary: true
                icon: mdi:weather-sunset-up
                icon_color: amber
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.guten_morgen
                  confirmation:
                    text: 'Guten Morgen: Alarm aus, Licht aus, Rollläden hoch?'
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 22px;
                      border: none;
                      background: linear-gradient(135deg, rgba(255,193,7,.34), rgba(255,193,7,.08));
                    }
              - type: custom:mushroom-template-card
                primary: Gute Nacht
                secondary: Innen aus · Außen an · Rollos zu · Alarm an
                multiline_secondary: true
                icon: mdi:weather-night
                icon_color: indigo
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.gute_nacht
                  confirmation:
                    text: >-
                      Gute Nacht: Innenlicht aus, Außenlicht an, Rollläden zu,
                      Alarm auf Zuhause?
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 22px;
                      border: none;
                      background: linear-gradient(135deg, rgba(63,81,181,.34), rgba(63,81,181,.08));
                    }
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: >-
                  {{ 'mdi:garage-open' if
                  is_state('cover.smart_garage_door_2006048876520336100248e1e91e491b_garage',
                  'open') else 'mdi:garage' }}
                icon_color: >-
                  {% set z =
                  states('cover.smart_garage_door_2006048876520336100248e1e91e491b_garage')
                  %} {{ 'red' if z == 'open' else ('amber' if z in ['opening',
                  'closing'] else ('disabled' if z in ['unavailable', 'unknown']
                  else 'green')) }}
                content: >-
                  {% set z =
                  states('cover.smart_garage_door_2006048876520336100248e1e91e491b_garage')
                  %} Garage {{ {'open': 'offen', 'closed': 'zu', 'opening':
                  'öffnet', 'closing': 'schließt', 'unavailable': '?',
                  'unknown': '?'}.get(z, z) }}
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-zutritt
              - type: template
                icon: >-
                  {{ 'mdi:smoke-detector-variant-alert' if
                  is_state('binary_sensor.co2_melder_wohnzimmer_rauch', 'on')
                  else 'mdi:smoke-detector-variant' }}
                icon_color: >-
                  {% set r = states('binary_sensor.co2_melder_wohnzimmer_rauch')
                  %} {{ 'red' if r == 'on' else ('disabled' if r in
                  ['unavailable', 'unknown'] else 'green') }}
                content: >-
                  {% set r = states('binary_sensor.co2_melder_wohnzimmer_rauch')
                  %} {{ 'RAUCHALARM' if r == 'on' else ('Rauchmelder ?' if r in
                  ['unavailable', 'unknown'] else 'Rauchmelder ok') }}
                tap_action:
                  action: none
              - type: template
                icon: >-
                  {{ 'mdi:water-alert' if
                  is_state('binary_sensor.wasssermelder_uberflutung','on') else
                  'mdi:water-check' }}
                icon_color: >-
                  {% set w = states('binary_sensor.wasssermelder_uberflutung')
                  %}{{ 'red' if w == 'on' else ('disabled' if w in
                  ['unavailable','unknown'] else 'green') }}
                content: >-
                  {% set w = states('binary_sensor.wasssermelder_uberflutung')
                  %}{{ 'ÜBERFLUTUNG' if w == 'on' else ('Wasser ?' if w in
                  ['unavailable','unknown'] else 'Wasser ok') }}
                tap_action:
                  action: none
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:lightbulb-off
                content: Licht aus
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_off
                  target:
                    entity_id:
                      - light.vorgarten
                      - light.terrasse
                      - light.gartenhutte
                      - light.gastewc
                      - light.einfahrt_leuchte
                      - light.haus_seite_leuchte
                      - switch.garage_aussenbeleuchtung
                      - switch.shelly1_e89f6d867192
                      - switch.shellyplug_s_fdcccb
                      - switch.licht_haus_terrasse
                      - light.shelly_stehlampe_gross
                      - light.shelly_stehlampe_gross_2
                      - switch.shelly2pmg3_8cbfea97b4e0_output_0
                      - switch.shelly2pmg3_8cbfea97b4e0_output_1
                      - light.kinderzimmer
              - type: template
                icon: mdi:outdoor-lamp
                content: Außen aus
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_off
                  target:
                    entity_id:
                      - light.vorgarten
                      - light.terrasse
                      - light.gartenhutte
                      - light.einfahrt_leuchte
                      - light.haus_seite_leuchte
                      - switch.garage_aussenbeleuchtung
                      - switch.shelly1_e89f6d867192
                      - switch.shellyplug_s_fdcccb
                      - switch.licht_haus_terrasse
              - type: template
                icon: mdi:window-shutter
                content: Rollos zu
                tap_action:
                  action: perform-action
                  perform_action: cover.close_cover
                  target:
                    entity_id:
                      - cover.rollo_badezimmer
                      - cover.rollo_flur_links
                      - cover.rollo_flur_rechts
                      - cover.rollo_gaste_wc
                      - cover.rollo_hwr
                      - cover.rollo_kinderzimmer_clara
                      - cover.rollo_kinderzimmer_paul
                      - cover.rollo_kuche
                      - cover.rollo_schlafzimmer
                      - cover.rollo_wohnzimmer_feld
                      - cover.rollo_wohnzimmer_garten_mitte
                      - cover.rollo_wohnzimmer_garten_rechts
                      - cover.rollo_wohnzimmer_strasse_links
                      - cover.rollo_wohnzimmer_strasse_rechts
                  confirmation:
                    text: Alle Rollläden schließen?
              - type: template
                icon: mdi:window-shutter-open
                content: Rollos auf
                tap_action:
                  action: perform-action
                  perform_action: cover.open_cover
                  target:
                    entity_id:
                      - cover.rollo_badezimmer
                      - cover.rollo_flur_links
                      - cover.rollo_flur_rechts
                      - cover.rollo_gaste_wc
                      - cover.rollo_hwr
                      - cover.rollo_kinderzimmer_clara
                      - cover.rollo_kinderzimmer_paul
                      - cover.rollo_kuche
                      - cover.rollo_schlafzimmer
                      - cover.rollo_wohnzimmer_feld
                      - cover.rollo_wohnzimmer_garten_mitte
                      - cover.rollo_wohnzimmer_garten_rechts
                      - cover.rollo_wohnzimmer_strasse_links
                      - cover.rollo_wohnzimmer_strasse_rechts
            grid_options:
              columns: 12
              rows: auto
          - type: heading
            heading: Auf einen Blick
            heading_style: subtitle
            icon: mdi:view-dashboard
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Licht
                secondary: >-
                  {% set n =
                  expand(['light.vorgarten','light.terrasse','light.gartenhutte','light.gastewc','light.einfahrt_leuchte','light.haus_seite_leuchte','switch.garage_aussenbeleuchtung','switch.shelly1_e89f6d867192','switch.shellyplug_s_fdcccb','switch.licht_haus_terrasse','light.shelly_stehlampe_gross','light.shelly_stehlampe_gross_2','switch.shelly2pmg3_8cbfea97b4e0_output_0','switch.shelly2pmg3_8cbfea97b4e0_output_1','light.kinderzimmer'])
                  | selectattr('state','eq','on') | list | count %}{{ 'Alles
                  aus' if n == 0 else n ~ ' an' }}
                icon: mdi:lightbulb-group
                icon_color: >-
                  {% set n =
                  expand(['light.vorgarten','light.terrasse','light.gartenhutte','light.gastewc','light.einfahrt_leuchte','light.haus_seite_leuchte','switch.garage_aussenbeleuchtung','switch.shelly1_e89f6d867192','switch.shellyplug_s_fdcccb','switch.licht_haus_terrasse','light.shelly_stehlampe_gross','light.shelly_stehlampe_gross_2','switch.shelly2pmg3_8cbfea97b4e0_output_0','switch.shelly2pmg3_8cbfea97b4e0_output_1','light.kinderzimmer'])
                  | selectattr('state','eq','on') | list | count %}{{ 'amber' if
                  n > 0 else 'disabled' }}
                layout: vertical
                fill_container: true
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-lichtsteuerung
                card_mod:
                  style: >
                    ha-card { border-radius: 22px; border: none; min-height:
                    118px;
                      {% set n = expand(['light.vorgarten','light.terrasse','light.gartenhutte','light.gastewc','light.einfahrt_leuchte','light.haus_seite_leuchte','switch.garage_aussenbeleuchtung','switch.shelly1_e89f6d867192','switch.shellyplug_s_fdcccb','switch.licht_haus_terrasse','light.shelly_stehlampe_gross','light.shelly_stehlampe_gross_2','switch.shelly2pmg3_8cbfea97b4e0_output_0','switch.shelly2pmg3_8cbfea97b4e0_output_1','light.kinderzimmer']) | selectattr('state','eq','on') | list | count %}{% set rgb = '255,193,7' if n > 0 else '120,144,156' %}
                      background: linear-gradient(135deg, rgba({{ rgb }},.38), rgba({{ rgb }},.08));
                      box-shadow: 0 4px 14px rgba({{ rgb }},.15); }
              - type: custom:mushroom-template-card
                primary: Rollos
                secondary: >-
                  {% set r = states.cover |
                  selectattr('entity_id','match','cover.rollo_') | list %}{% set
                  offen = r | rejectattr('state','eq','closed') | list | count
                  %}{{ 'Alle zu' if offen == 0 else offen ~ ' offen' }}
                icon: mdi:window-shutter
                icon_color: >-
                  {% set r = states.cover |
