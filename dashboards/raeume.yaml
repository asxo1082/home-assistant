      - type: grid
        cards:
          - type: heading
            heading: Klima
            icon: mdi:air-conditioner
          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('climate.wf_rac_9707','current_temperature') |
              float(0) | round(1) | string | replace('.', ',') }} °C
            secondary: >-
              {% set s = states('climate.wf_rac_9707') %} {{
              {'off':'Aus','cool':'Kühlen','heat':'Heizen','auto':'Auto','dry':'Entfeuchten','fan_only':'Lüften','unavailable':'Nicht
              erreichbar'}.get(s, s) }} · Soll {{
              state_attr('climate.wf_rac_9707','temperature') | float(0) |
              round(1) | string | replace('.', ',') }} °C
            icon: mdi:air-conditioner
            icon_color: >-
              {% set s = states('climate.wf_rac_9707') %} {{ 'red' if s in
              ['heat','unavailable'] else ('blue' if s == 'cool' else ('teal' if
              s in ['dry','fan_only'] else ('green' if s == 'auto' else
              'disabled'))) }}
            layout: vertical
            fill_container: true
            tap_action:
              action: none
            card_mod:
              style: |
                ha-card {
                  --card-primary-font-size: 38px;
                  --card-primary-font-weight: 600;
                  --card-secondary-font-size: 15px;
                  text-align: center;
                  padding: 12px 0;
                  border-radius: 22px;
                  border: none;
                  {% set s = states('climate.wf_rac_9707') %}
                  {% if s == 'heat' %}
                  background: linear-gradient(135deg, rgba(244,67,54,.30), rgba(244,67,54,.06));
                  {% elif s == 'cool' %}
                  background: linear-gradient(135deg, rgba(33,150,243,.30), rgba(33,150,243,.06));
                  {% elif s == 'auto' %}
                  background: linear-gradient(135deg, rgba(76,175,80,.28), rgba(76,175,80,.06));
                  {% elif s in ['dry','fan_only'] %}
                  background: linear-gradient(135deg, rgba(0,150,136,.28), rgba(0,150,136,.06));
                  {% else %}
                  background: linear-gradient(135deg, rgba(158,158,158,.18), rgba(158,158,158,.04));
                  {% endif %}
                }
          - type: tile
            entity: climate.wf_rac_9707
            name: Steuerung
            icon: mdi:tune-variant
            hide_state: true
            vertical: false
            features_position: bottom
            features:
              - type: climate-hvac-modes
                style: icons
                hvac_modes:
                  - 'off'
                  - auto
                  - cool
                  - heat
                  - dry
                  - fan_only
              - type: target-temperature
          - type: heading
            heading: Solltemperatur
            heading_style: subtitle
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: 18°
                secondary: >-
                  {{ 'Aktiv' if (not is_state('climate.wf_rac_9707','off') and
                  state_attr('climate.wf_rac_9707','temperature') | float(0) ==
                  18) else '' }}
                icon: mdi:snowflake
                icon_color: blue
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: climate.set_temperature
                  target:
                    entity_id: climate.wf_rac_9707
                  data:
                    temperature: 18
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      --card-primary-font-size: 20px;
                      --card-primary-font-weight: 700;
                      --card-secondary-font-size: 11px;
                      {% if (not is_state('climate.wf_rac_9707','off') and state_attr('climate.wf_rac_9707','temperature') | float(0) == 18) %}
                      border: 3px solid rgb(33,150,243);
                      background: linear-gradient(160deg, rgba(33,150,243,.55), rgba(33,150,243,.15));
                      {% else %}
                      border: none;
                      background: linear-gradient(160deg, rgba(33,150,243,.22), rgba(33,150,243,.05));
                      {% endif %}
                    }
              - type: custom:mushroom-template-card
                primary: 20°
                secondary: >-
                  {{ 'Aktiv' if (not is_state('climate.wf_rac_9707','off') and
                  state_attr('climate.wf_rac_9707','temperature') | float(0) ==
                  20) else '' }}
                icon: mdi:thermometer-low
                icon_color: cyan
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: climate.set_temperature
                  target:
                    entity_id: climate.wf_rac_9707
                  data:
                    temperature: 20
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 20px;
                      --card-primary-font-size: 20px;
                      --card-primary-font-weight: 700;
                      --card-secondary-font-size: 11px;
                      {% if (not is_state('climate.wf_rac_9707','off') and state_attr('climate.wf_rac_9707','temperature') | float(0) == 20) %}
                      border: 3px solid rgb(0,188,212);
                      background: linear-gradient(160deg, rgba(0,188,212,.55), rgba(0,188,212,.15));
                      {% else %}
                      border: none;
                      background: linear-gradient(160deg, rgba(0,188,212,.22), rgba(0,188,212,.05));
                      {% endif %}
                    }
