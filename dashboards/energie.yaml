                show_header_toggle: false
                entities:
                  - entity: input_select.wallbox
                    name: Lade-Modus
                  - entity: input_boolean.tibber_tarif_aktiv
                    name: Tibber-Tarif aktiv (ab Januar)
                  - type: conditional
                    conditions:
                      - entity: input_select.wallbox
