            heading_style: title
            icon: mdi:tune
            grid_options:
              columns: full
          - type: vertical-stack
            cards:
              - type: entities
                title: ⚡ Energie Automatik
                show_header_toggle: false
                entities:
                  - entity: input_select.energie_modus
                    name: Hauptschalter
              - type: entities
                title: 🔋 Speicher-Steuerung (Pylontech & Kostal)
                show_header_toggle: false
                entities:
                  - entity: input_select.batterie_modus
                    name: Speicher-Modus
                  - entity: input_boolean.entladeschutz_autoladen
                    name: Batterie nicht ins Auto entladen
                  - type: conditional
                    conditions:
                      - entity: input_select.batterie_modus
                        state: Netzladen erzwingen
                    row:
                      entity: input_select.netzladeleistung
                      name: Netzladeleistung (W, max. 2500)
                  - type: conditional
                    conditions:
                      - entity: input_select.batterie_modus
                        state: Netzladen erzwingen
                    row:
                      entity: input_number.netzladen_max_soc
                      name: Netzladen bis Ladestand
                  - entity: sensor.plenticoreseelen_battery_soc
                    name: Ladestand
                  - entity: sensor.plenticoreseelen_battery_power
                    name: Batterieleistung
              - type: entities
