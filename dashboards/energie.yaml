views:
  - title: Live
    path: live
    icon: mdi:flash
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Jetzt
            heading_style: title
            icon: mdi:flash
            grid_options:
              columns: full
          - type: custom:mushroom-template-card
            entity: binary_sensor.kostal_storung
            primary: >-
              {% set s = states('binary_sensor.kostal_storung') %}{{ 'Kostal –
              Störung' if s == 'on' else ('Kostal – alles in Ordnung' if s ==
              'off' else 'Kostal – Überwachung nicht verfügbar') }}
            secondary: >-
              {% set s = states('binary_sensor.kostal_storung') %}{% if s ==
              'on' %}{{ state_attr('binary_sensor.kostal_storung', 'gruende')
              }}{% elif s == 'off' %}Wechselrichter erreichbar, Werte
              plausibel{% else %}Sensor binary_sensor.kostal_storung prüfen{%
              endif %}
            multiline_secondary: true
            icon: >-
              {% set s = states('binary_sensor.kostal_storung') %}{{
              'mdi:alert-octagon' if s == 'on' else ('mdi:check-circle' if s ==
              'off' else 'mdi:help-circle') }}
            icon_color: >-
              {% set s = states('binary_sensor.kostal_storung') %}{{ 'red' if s
              == 'on' else ('green' if s == 'off' else 'grey') }}
            layout: horizontal
            fill_container: true
            grid_options:
              columns: full
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { border-radius: 22px;
                  {% set s = states('binary_sensor.kostal_storung') %}{% set rgb = '244,67,54' if s == 'on' else ('76,175,80' if s == 'off' else '120,144,156') %}
                  border: {{ '2px solid rgba(244,67,54,.7)' if s == 'on' else 'none' }};
                  background: linear-gradient(135deg, rgba({{ rgb }},.36), rgba({{ rgb }},.08)); }
          - type: grid
            columns: 2
            square: false
            grid_options:
              columns: full
            cards:
              - type: custom:mushroom-template-card
                primary: Solar
                secondary: >-
                  {% set pv = states('sensor.pv_erzeugung') | float(0) %}{% set
                  s = 'sensor.plenticoreseelen_energy_yield_day' %}{% set e =
                  states(s) | float(0) %}{% set e = (e / 1000) if state_attr(s,
                  'unit_of_measurement') == 'Wh' else e %}jetzt {{ (pv / 1000)
                  | round(1) | string | replace('.', ',') }} kW

                  heute {{ e | round(1) | string | replace('.', ',') }} kWh
                multiline_secondary: true
                icon: mdi:solar-power
                icon_color: >-
                  {% set pv = states('sensor.pv_erzeugung') | float(0) %}{{
                  'amber' if pv > 50 else 'disabled' }}
                layout: vertical
                fill_container: true
                card_mod:
                  style: >
                    ha-card { border-radius: 22px; border: none; min-height:
                    120px;
                      {% set pv = states('sensor.pv_erzeugung') | float(0) %}{% set rgb = '255,193,7' if pv > 50 else '120,144,156' %}
                      background: linear-gradient(135deg, rgba({{ rgb }},.36), rgba({{ rgb }},.08)); }
                    .secondary { white-space: pre-line !important; }
                tap_action:
                  action: more-info
                  entity: sensor.plenticoreseelen_energy_yield_day
              - type: custom:mushroom-template-card
                primary: Haus
                secondary: >-
                  {% set h = states('sensor.plenticoreseelen_home_power') |
                  float(0) %}{% set s =
                  'sensor.plenticoreseelen_home_consumption_day' %}{% set e =
                  states(s) | float(0) %}{% set e = (e / 1000) if state_attr(s,
                  'unit_of_measurement') == 'Wh' else e %}{% set a =
                  states('sensor.plenticoreseelen_autarky_day') | float(0)
                  %}jetzt {{ (h / 1000) | round(1) | string | replace('.', ',')
                  }} kW

                  heute {{ e | round(1) | string | replace('.', ',') }} kWh · {{
                  a | round(0) | int }} % autark
                multiline_secondary: true
                icon: mdi:home-lightning-bolt
                icon_color: indigo
                layout: vertical
                fill_container: true
                card_mod:
                  style: >
                    ha-card { border-radius: 22px; border: none; min-height:
                    120px;
                      background: linear-gradient(135deg, rgba(63,81,181,.30), rgba(63,81,181,.08)); }
                    .secondary { white-space: pre-line !important; }
                tap_action:
                  action: more-info
                  entity: sensor.plenticoreseelen_home_consumption_day
              - type: custom:mushroom-template-card
                primary: Netz
                secondary: >-
                  {% set g = states('sensor.plenticoreseelen_grid_power') |
                  float(0) %}{% set b =
                  'sensor.plenticoreseelen_home_consumption_from_grid_day' %}{%
                  set eb = states(b) | float(0) %}{% set eb = (eb / 1000) if
                  state_attr(b, 'unit_of_measurement') == 'Wh' else eb %}{% set
                  f = 'sensor.plenticoreseelen_energy_to_grid_day' %}{% set ef =
                  states(f) | float(0) %}{% set ef = (ef / 1000) if
                  state_attr(f, 'unit_of_measurement') == 'Wh' else ef %}jetzt
                  {{ ('Bezug ' ~ ((g / 1000) | round(1) | string | replace('.',
                  ',')) ~ ' kW') if g > 50 else (('Einspeisung ' ~ ((-g / 1000) |
                  round(1) | string | replace('.', ',')) ~ ' kW') if g < -50 else
                  'ausgeglichen') }}

                  heute Bezug {{ eb | round(1) | string | replace('.', ',') }} ·
                  Einsp. {{ ef | round(1) | string | replace('.', ',') }} kWh
                multiline_secondary: true
                icon: mdi:transmission-tower
                icon_color: >-
                  {% set g = states('sensor.plenticoreseelen_grid_power') |
                  float(0) %}{{ 'red' if g > 50 else ('green' if g < -50 else
                  'blue') }}
                layout: vertical
                fill_container: true
                card_mod:
                  style: >
                    ha-card { border-radius: 22px; border: none; min-height:
                    120px;
                      {% set g = states('sensor.plenticoreseelen_grid_power') | float(0) %}{% set rgb = '244,67,54' if g > 50 else ('76,175,80' if g < -50 else '33,150,243') %}
                      background: linear-gradient(135deg, rgba({{ rgb }},.36), rgba({{ rgb }},.08)); }
                    .secondary { white-space: pre-line !important; }
                tap_action:
                  action: more-info
                  entity: sensor.plenticoreseelen_home_consumption_from_grid_day
              - type: custom:mushroom-template-card
                primary: Batterie
                secondary: >-
                  {% set soc = states('sensor.plenticoreseelen_battery_soc') |
                  float(0) %}{% set p =
                  states('sensor.plenticoreseelen_battery_power') | float(0)
                  %}{% set ns = namespace(c=0) %}{% for s in
                  ['sensor.plenticoreseelen_battery_charge_from_pv_day',
                  'sensor.plenticoreseelen_battery_charge_from_grid_day'] %}{%
                  set e = states(s) | float(0) %}{% set ns.c = ns.c + ((e /
                  1000) if state_attr(s, 'unit_of_measurement') == 'Wh' else e)
                  %}{% endfor %}{% set d =
                  'sensor.plenticoreseelen_battery_discharge_day' %}{% set ed =
                  states(d) | float(0) %}{% set ed = (ed / 1000) if
                  state_attr(d, 'unit_of_measurement') == 'Wh' else ed %}jetzt
                  {{ soc | round(0) | int }} % · {{ ('lädt ' ~ ((-p / 1000) |
                  round(1) | string | replace('.', ',')) ~ ' kW') if p < -50 else
                  (('entlädt ' ~ ((p / 1000) | round(1) | string | replace('.',
                  ',')) ~ ' kW') if p > 50 else 'bereit') }}

                  heute rein {{ ns.c | round(1) | string | replace('.', ',') }}
                  · raus {{ ed | round(1) | string | replace('.', ',') }} kWh
                multiline_secondary: true
                icon: mdi:battery-high
                icon_color: >-
                  {% set s = states('sensor.plenticoreseelen_battery_soc') |
                  float(0) %}{{ 'red' if s < 20 else ('amber' if s < 50 else
                  'green') }}
                layout: vertical
                fill_container: true
                card_mod:
                  style: >
                    ha-card { border-radius: 22px; border: none; min-height:
                    120px;
                      {% set s = states('sensor.plenticoreseelen_battery_soc') | float(0) %}{% set rgb = '244,67,54' if s < 20 else ('255,160,0' if s < 50 else '76,175,80') %}
                      background: linear-gradient(135deg, rgba({{ rgb }},.36), rgba({{ rgb }},.08)); }
                    .secondary { white-space: pre-line !important; }
                tap_action:
                  action: more-info
                  entity: sensor.plenticoreseelen_battery_soc
          - type: custom:mushroom-template-card
            entity: sensor.sonnenstrom_ampel
            primary: >-
              {% set a = states('sensor.sonnenstrom_ampel') %}{{ {'gruen':
              'Jetzt waschen oder trocknen ☀️', 'gelb': 'Geht so – lieber noch
              etwas warten', 'rot': 'Gerade kein Sonnenstrom übrig'}.get(a,
              'Sonnenstrom-Ampel nicht verfügbar') }}
            secondary: >-
              {% if states('sensor.sonnenstrom_ampel') in ['gruen', 'gelb',
              'rot'] %}Überschuss {{ (states('sensor.sonnenstrom_uberschuss') |
              float(0) / 1000) | round(1) | string | replace('.', ',') }} kW ·
              Speicher {{ states('sensor.plenticoreseelen_battery_soc') |
              float(0) | round(0) | int }} %{% else %}Helfer
              sensor.sonnenstrom_ampel prüfen{% endif %}
            icon: >-
              {{ {'gruen': 'mdi:washing-machine', 'gelb':
              'mdi:weather-partly-cloudy', 'rot':
              'mdi:weather-cloudy'}.get(states('sensor.sonnenstrom_ampel'),
              'mdi:help-circle') }}
            icon_color: >-
              {{ {'gruen': 'green', 'gelb': 'amber', 'rot':
              'red'}.get(states('sensor.sonnenstrom_ampel'), 'grey') }}
            layout: horizontal
            fill_container: true
            grid_options:
              columns: full
            tap_action:
              action: more-info
              entity: sensor.sonnenstrom_uberschuss
            card_mod:
              style: >
                ha-card { border-radius: 22px; border: none;
                  {% set c = {'gruen': '76,175,80', 'gelb': '255,193,7', 'rot': '244,67,54'}.get(states('sensor.sonnenstrom_ampel'), '120,144,156') %}
                  background: linear-gradient(135deg, rgba({{ c }},.30), rgba({{ c }},.08)); }
          - type: vertical-stack
            cards:
              - type: custom:power-flow-card-plus
                entities:
                  battery:
                    entity: sensor.plenticoreseelen_battery_power
                    state_of_charge: sensor.plenticoreseelen_battery_soc
                    show_state_of_charge: true
                    state_of_charge_unit_white_space: true
                    display_state: two_way
                    invert_state: false
                    display_zero: true
                    name: Batterie
                  grid:
                    entity: sensor.plenticoreseelen_grid_power
                    display_state: two_way
                    invert_state: false
                    name: Strom
                  solar:
                    entity: sensor.plenticoreseelen_sum_power_of_all_pv_dc_inputs
                    display_zero_state: true
                    display_zero: true
                    invert_state: false
                    use_metadata: false
                    icon: mdi:solar-power-variant
                    name: PV-Haus
                  individual:
                    - entity: sensor.keba_p30_charging_power
                      name: Auto
                      icon: mdi:car-electric
                      display_zero: true
                      display_zero_state: true
                      secondary_info:
                        entity: sensor.keba_p30_session_energy
                        unit_of_measurement: kWh
                        icon: mdi:battery-charging
                        decimals: 1
                        display_zero: true
                    - entity: sensor.garage_klima_leistung
                      name: Garage + Klima
                    - entity: sensor.vorgarten_leistung
                      name: Vorgarten
                      color_value: true
                    - entity: sensor.ecoflow_powerstream_solarleistung
                      name: PV-EcoFlow
                      inverted_animation: true
                      icon: mdi:solar-power-variant
                  home:
                    entity: sensor.plenticoreseelen_home_power
                    override_state: true
                    subtract_individual: false
                    hide: false
                    name: Haus
                    circle_animation: true
                    color_value: true
                    color_icon: true
                clickable_entities: true
                display_zero_lines:
                  mode: show
                  transparency: 50
                  grey_color:
                    - 189
                    - 189
                    - 189
                use_new_flow_rate_model: true
                base_decimals: 0
                kilo_decimals: 1
                min_flow_rate: 0.75
                max_flow_rate: 6
                max_expected_power: 11000
                min_expected_power: 0.01
                kilo_threshold: 1000
                mega_threshold: 1000000
                sort_individual_devices: false
                dashboard_link: /energy
                dashboard_link_label: Energie-Dashboard
              - type: custom:apexcharts-card
                header:
                  show: true
                  title: Verlauf
                  show_states: false
                graph_span: 24h
                span:
                  start: day
                update_interval: 5min
                apex_config:
                  chart:
                    height: 320
                    stacked: true
                  xaxis:
                    labels:
                      datetimeUTC: false
                      format: HH
                  legend:
                    position: bottom
                all_series_config:
                  group_by:
                    func: avg
                    duration: 5min
                    fill: last
                  float_precision: 2
                  show:
                    legend_value: false
                yaxis:
                  - id: kw
                    min: 0
                    decimals: 1
                    apex_config:
                      title:
                        text: kW
                      forceNiceScale: true
                  - id: soc
                    opposite: true
                    min: 0
                    max: 100
                    decimals: 0
                    apex_config:
                      title:
                        text: '%'
                series:
                  - entity: sensor.plenticoreseelen_home_power_from_grid
                    name: Netzbezug
                    type: area
                    yaxis_id: kw
                    color: '#D0D0D0'
                    opacity: 0.8
                    stroke_width: 0
                    transform: return x / 1000;
                  - entity: sensor.plenticoreseelen_home_power_from_pv
                    name: Direktnutzung
                    type: area
                    yaxis_id: kw
                    color: '#8BC34A'
                    opacity: 0.85
                    stroke_width: 0
                    transform: return x / 1000;
                  - entity: sensor.plenticoreseelen_home_power_from_battery
                    name: Batterieentladung
                    type: area
                    yaxis_id: kw
                    color: '#4A90C2'
                    opacity: 0.85
                    stroke_width: 0
                    transform: return x / 1000;
                  - entity: sensor.plenticoreseelen_pv_to_battery_power
                    name: Batterieladung
                    type: area
                    yaxis_id: kw
                    color: '#8EDDFF'
                    opacity: 0.85
                    stroke_width: 0
                    transform: return x / 1000;
                  - entity: sensor.plenticoreseelen_grid_power
                    name: Einspeisung
                    type: area
                    yaxis_id: kw
                    color: '#FFC857'
                    opacity: 0.9
                    stroke_width: 0
                    transform: 'return x < 0 ? -x / 1000 : 0;'
                  - entity: sensor.plenticoreseelen_home_power
                    name: Verbrauch
                    type: line
                    yaxis_id: kw
                    color: '#7A7A7A'
                    stroke_width: 2.5
                    transform: return x / 1000;
                  - entity: sensor.plenticoreseelen_battery_soc
                    name: Ladezustand (SoC)
                    type: line
                    yaxis_id: soc
                    color: '#8E7CC3'
                    stroke_width: 2.5
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Strompreis
            heading_style: title
            icon: mdi:currency-eur
            grid_options:
              columns: full
          - type: custom:mushroom-template-card
            grid_options:
              columns: full
            primary: Strompreis
            secondary: >-
              {% set fix =
              is_state('input_boolean.tibber_tarif_aktiv','off') %}{% set p
              = (states('sensor.preis_netzbezug_fix') if fix else
              states('sensor.strompreis_tibber_berechnet')) | float(0) %}{{
              (p*100) | round(1) | string | replace('.', ',') }} ct/kWh · {{
              'Fixtarif' if fix else ('günstig' if
              is_state('binary_sensor.tibber_laden_freigabe','on') else
              'normal') }}
            icon: mdi:currency-eur
            icon_color: >-
              {{ 'blue' if
              is_state('input_boolean.tibber_tarif_aktiv','off') else
              ('green' if
              is_state('binary_sensor.tibber_laden_freigabe','on') else
              'blue') }}
            layout: vertical
            fill_container: true
            card_mod:
              style: >
                ha-card { border-radius: 22px; border: none; min-height:
                110px;
                  {% set rgb = '76,175,80' if (not is_state('input_boolean.tibber_tarif_aktiv','off') and is_state('binary_sensor.tibber_laden_freigabe','on')) else '33,150,243' %}
                  background: linear-gradient(135deg, rgba({{ rgb }},.36), rgba({{ rgb }},.08)); }
            tap_action:
              action: none
          - type: custom:apexcharts-card
            header:
              show: true
              title: Strompreis heute und morgen
              show_states: false
            graph_span: 48h
            span:
              start: day
            now:
              show: true
              label: Jetzt
            apex_config:
              chart:
                height: 280
              xaxis:
                labels:
                  datetimeUTC: false
              yaxis:
                decimalsInFloat: 2
            series:
              - entity: sensor.nord_pool_preise_verlauf
                name: Börsenpreis
                type: line
                curve: stepline
                stroke_width: 2
                extend_to: false
                show:
                  legend_value: false
                data_generator: >
                  const a = (entity.attributes.heute ||
                  []).concat(entity.attributes.morgen || []);

                  return a.map(e => [e[0], e[1]]);
              - entity: sensor.nord_pool_preise_verlauf
                name: Gesamtpreis (berechnet)
                type: line
                curve: stepline
                stroke_width: 2
                extend_to: false
                show:
                  legend_value: false
                data_generator: >
                  const a = (entity.attributes.heute ||
                  []).concat(entity.attributes.morgen || []);

                  return a.map(e => [e[0], e[2]]);
            grid_options:
              columns: full
          - type: heading
            heading: Sonne
            heading_style: title
            icon: mdi:weather-sunny
            grid_options:
              columns: full
          - type: custom:horizon-card
            moon: true
            fields:
              sunrise: true
              sunset: true
              dawn: true
              noon: true
              dusk: true
              azimuth: true
              elevation: true
              moonrise: true
              moonset: true
              moon_phase: true
            language: de
            time_format: 24
            grid_options:
              columns: full
    background:
      opacity: 40
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
    badges: []
  - title: Heute
    path: heute
    icon: mdi:calendar-today
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heute
            heading_style: title
            icon: mdi:calendar-today
            grid_options:
              columns: full
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.plenticoreseelen_autarky_day
                name: Autarkie
                min: 0
                max: 100
              - type: gauge
                entity: sensor.pv_anteil_verbrauch
                name: PV-Anteil
                min: 0
                max: 100
              - type: gauge
                entity: sensor.plenticoreseelen_battery_soc
                name: Batterie
                min: 0
                max: 100
                severity:
                  red: 0
                  yellow: 20
                  green: 50
              - type: gauge
                entity: sensor.plenticoreseelen_own_consumption_rate_day
                name: Eigenverbrauch
                min: 0
                max: 100
            grid_options:
              columns: full
          - type: glance
            title: 💶 Kosten heute
            show_name: true
            show_icon: false
            show_state: true
            columns: 3
            entities:
              - entity: sensor.kosten_netzbezug_heute
                name: Netzbezug
              - entity: sensor.gutschrift_einspeisung_heute
                name: Einspeisung
              - entity: sensor.strom_saldo_heute
                name: Saldo
            grid_options:
              columns: full
          - type: vertical-stack
            cards:
              - type: sensor
                entity: sensor.plenticoreseelen_home_consumption_day
                name: Verbrauch
                graph: none
              - type: glance
                show_name: true
                show_icon: false
                show_state: true
                columns: 3
                entities:
                  - entity: sensor.plenticoreseelen_home_consumption_from_grid_day
                    name: aus Netz
                  - entity: sensor.plenticoreseelen_home_consumption_from_battery_day
                    name: aus Batterie
                  - entity: sensor.plenticoreseelen_home_consumption_from_pv_day
                    name: aus PV
            grid_options:
              columns: full
          - type: vertical-stack
            cards:
              - type: sensor
                entity: sensor.erzeugung_tag
                name: Erzeugung
                graph: none
              - type: glance
                show_name: true
                show_icon: false
                show_state: true
                columns: 3
                entities:
                  - entity: sensor.plenticoreseelen_energy_to_grid_day
                    name: Einspeisung
                  - entity: sensor.plenticoreseelen_battery_charge_from_pv_day
                    name: Batterieladung
                  - entity: sensor.plenticoreseelen_home_consumption_from_pv_day
                    name: Direktnutzung
            grid_options:
              columns: full
    background:
      opacity: 40
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
    badges: []
  - title: Einnahmen
    path: einnahmen
    icon: mdi:cash-plus
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Was ich verdiene
            heading_style: title
            icon: mdi:cash-plus
            grid_options:
              columns: full
          - type: grid
            columns: 2
            square: false
            grid_options:
              columns: full
            cards:
              - type: custom:mushroom-template-card
                primary: Heute
                secondary: >-
                  {{ states('sensor.gutschrift_einspeisung_heute') | float(0) |
                  round(2) | string | replace('.', ',') }} € · {{
                  states('sensor.plenticoreseelen_energy_to_grid_day') |
                  float(0) | round(1) | string | replace('.', ',') }} kWh
                icon: mdi:cash-plus
                icon_color: green
                layout: vertical
                fill_container: true
                tap_action:
                  action: none
                card_mod:
                  style: >
                    ha-card { border-radius: 22px; border: none; min-height:
                    110px;
                      background: linear-gradient(135deg, rgba(76,175,80,.34), rgba(76,175,80,.08)); }
              - type: custom:mushroom-template-card
                primary: Diese Woche
                secondary: >-
                  {{ states('sensor.verdienst_woche') | float(0) | round(2) |
                  string | replace('.', ',') }} € · {{
                  states('sensor.einspeisung_kwh_woche') | float(0) | round(1) |
                  string | replace('.', ',') }} kWh
                icon: mdi:calendar-week
                icon_color: green
                layout: vertical
                fill_container: true
                tap_action:
                  action: none
                card_mod:
                  style: >
                    ha-card { border-radius: 22px; border: none; min-height:
                    110px;
                      background: linear-gradient(135deg, rgba(76,175,80,.34), rgba(76,175,80,.08)); }
              - type: custom:mushroom-template-card
                primary: Dieser Monat
                secondary: >-
                  {{ states('sensor.verdienst_monat') | float(0) | round(2) |
                  string | replace('.', ',') }} € · {{
                  states('sensor.einspeisung_kwh_monat') | float(0) | round(1) |
                  string | replace('.', ',') }} kWh
                icon: mdi:calendar-month
                icon_color: green
                layout: vertical
                fill_container: true
                tap_action:
                  action: none
                card_mod:
                  style: >
                    ha-card { border-radius: 22px; border: none; min-height:
