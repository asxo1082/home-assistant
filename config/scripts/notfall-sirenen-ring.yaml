alias: Notfall Sirenen Ring
mode: restart
sequence:
  - repeat:
      count: 4
      sequence:
        - action: siren.turn_on
          continue_on_error: true
          target:
            entity_id:
              - siren.bambulab1_sirene
              - siren.einfahrt_sirene
              - siren.einfahrt_sirene_2
              - siren.garage_sirene
              - siren.garage_sirene_2
              - siren.garten_sirene
              - siren.gartenhutte_sirene
              - siren.haus_seite_sirene
              - siren.mulltonnen_sirene
              - siren.seite_sirene
        - action: switch.turn_on
          continue_on_error: true
          target:
            entity_id: switch.alpen_alarm_siren
        - delay: '00:00:28'
  - action: siren.turn_off
    continue_on_error: true
    target:
      entity_id:
        - siren.bambulab1_sirene
        - siren.einfahrt_sirene
        - siren.einfahrt_sirene_2
        - siren.garage_sirene
        - siren.garage_sirene_2
        - siren.garten_sirene
        - siren.gartenhutte_sirene
        - siren.haus_seite_sirene
        - siren.mulltonnen_sirene
        - siren.seite_sirene
  - action: switch.turn_off
    continue_on_error: true
    target:
      entity_id: switch.alpen_alarm_siren
