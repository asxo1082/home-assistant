  mode: single
- id: '1793713022826'
  alias: Raspberry UniFi Netzwerk Controller Überwachung
  triggers:
  - trigger: state
    entity_id: binary_sensor.raspberry_15
    to: 'off'
    for: 00:02:00
    id: aus
  - trigger: state
    entity_id: binary_sensor.raspberry_15
    from: 'off'
    to: 'on'
    id: an
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: aus
      sequence:
      - action: notify.mobile_app_iphone_andreas
        data:
          title: ⚠️ Raspberry UniFi Netzwerk Controller offline
          message: Antwortet seit 2 Minuten nicht mehr.
          data:
            push:
              interruption-level: time-sensitive
            ttl: 0
            priority: high
    - conditions:
      - condition: trigger
        id: an
      - condition: template
        value_template: '{{ (now() - trigger.from_state.last_changed).total_seconds()
          > 120 }}'
      sequence:
      - action: notify.mobile_app_iphone_andreas
        data:
          title: ✅ Raspberry UniFi Netzwerk Controller wieder online
          message: War {{ ((now() - trigger.from_state.last_changed) .total_seconds()
            / 60) | round(0) | int }} Minuten weg.
  mode: queued
- id: '1793713041376'
  alias: Access Points Überwachung
  triggers:
  - trigger: state
    entity_id:
    - sensor.ap_wohnzimmer_zustand
    - sensor.ap_hwr_zustand
    - sensor.ap_gartenhaus_zustand
    - sensor.ap_dachboden_zustand
    - sensor.ap_garage_zustand
    to:
