        data:
          title: ⚠️ {{ ap }} offline
          message: Seit 2 Minuten nicht erreichbar.
          data:
            push:
              interruption-level: time-sensitive
            ttl: 0
            priority: high
    - conditions:
      - condition: trigger
        id: an
      - condition: template
        value_template: '{{ (now() - trigger.from_state.last_changed).total_seconds()
          > 120 }}'
      sequence:
      - action: notify.mobile_app_iphone_andreas
        data:
          title: ✅ {{ ap }} wieder online
          message: War {{ ((now() - trigger.from_state.last_changed) .total_seconds()
            / 60) | round(0) | int }} Minuten weg.
  mode: queued
- id: '1795000310001'
  alias: 'Kostal: Störungsmeldung'
  description: Push bei Kostal-Störung, tägliche Erinnerung um 8 Uhr solange sie anhält, Entwarnung wenn behoben
  triggers:
  - trigger: state
    entity_id: binary_sensor.kostal_storung
    to: 'on'
    id: an
  - trigger: time
    at: 08:00:00
    id: erinnerung
  - trigger: state
    entity_id: binary_sensor.kostal_storung
    from: 'on'
    to: 'off'
    id: behoben
  actions:
  - choose:
    - conditions:
      - "{{ trigger.id in ['an', 'erinnerung'] and is_state('binary_sensor.kostal_storung', 'on') }}"
      sequence:
      - action: notify.mobile_app_iphone_andreas
        data:
          title: ⚠️ Kostal – Störung
          message: "{{ state_attr('binary_sensor.kostal_storung', 'gruende') }}"
          data:
            tag: kostal_stoerung
            url: /dashboard-energie/live
            push:
              interruption-level: time-sensitive
    - conditions:
      - "{{ trigger.id == 'behoben' }}"
      sequence:
      - action: notify.mobile_app_iphone_andreas
        data:
          title: ✅ Kostal wieder in Ordnung
          message: Die Störung ist behoben.
          data:
            tag: kostal_stoerung
  mode: queued
- id: '1795002600001'
  alias: Sonnenstrom Waschen Hinweis
  description: Einmal am Tag melden, wenn genug PV-Überschuss für Waschmaschine oder Trockner da ist
  triggers:
  - trigger: state
    entity_id: sensor.sonnenstrom_ampel
    to: gruen
    for: 00:10:00
  conditions:
  - condition: time
    after: 08:00:00
    before: '17:00:00'
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or as_local(this.attributes.last_triggered).date()
      != now().date() }}"
  actions:
  - action: notify.mobile_app_iphone_andreas
    data:
      title: Sonnenstrom ☀️
      message: >-
        Jetzt ist ein guter Moment für Waschmaschine oder Trockner.
        Überschuss {{ (states('sensor.sonnenstrom_uberschuss') | float(0) / 1000) | round(1) | string | replace('.', ',') }} kW,
        Speicher {{ states('sensor.plenticoreseelen_battery_soc') | float(0) | round(0) | int }} %.
  mode: single
- id: '1795002600002'
  alias: Update verfügbar
  description: Täglich um 18:30 eine Push-Nachricht, wenn Updates bereitstehen (übersprungene zählen nicht)
  triggers:
  - trigger: time
    at: '18:30:00'
  conditions:
  - condition: template
    value_template: "{{ states.update | selectattr('state', 'eq', 'on') | list | count > 0 }}"
  actions:
  - variables:
      liste: >-
        {% set u = states.update | selectattr('state', 'eq', 'on') | list %}
        {% for s in u[:8] %}{{ s.name }} ({{ s.attributes.latest_version }}){{ '\n' if not loop.last }}{% endfor %}{{ '\n… und ' ~ (u | count - 8) ~ ' weitere' if u | count > 8 }}
      anzahl: "{{ states.update | selectattr('state', 'eq', 'on') | list | count }}"
  - action: notify.mobile_app_iphone_andreas
    data:
      title: "\U0001F504 {{ anzahl }} {{ 'Update' if anzahl | int == 1 else 'Updates' }} verfügbar"
      message: "{{ liste }}"
      data:
        url: /config/updates
        tag: updates
  mode: single
- id: '1795002600003'
  alias: 'Kostal: Zählersprung melden'
  description: >-
    Push, wenn ein Kostal-Gesamtzähler kleiner wird oder auf 0 fällt. Dann ist die
    Langzeitstatistik verfälscht (wie am 08.11.2026) und muss unter Entwicklerwerkzeuge →
    Statistiken → Summe anpassen korrigiert werden.
  triggers:
  - trigger: state
    entity_id:
    - sensor.plenticoreseelen_home_consumption_from_grid_total
    - sensor.plenticoreseelen_energy_to_grid_total
    - sensor.plenticoreseelen_energy_yield_total
    - sensor.plenticoreseelen_battery_charge_from_pv_total
    - sensor.plenticoreseelen_battery_charge_from_grid_total
    - sensor.plenticoreseelen_battery_discharge_total
  conditions:
  - condition: template
    value_template: >-
      {% set neu = trigger.to_state.state if trigger.to_state else 'unknown' %}
      {% set alt = trigger.from_state.state if trigger.from_state else 'unknown' %}
      {{ neu | is_number and (neu | float(0) < 1 or (alt | is_number and neu | float(0) < alt | float(0) - 0.05)) }}
  actions:
  - action: notify.mobile_app_iphone_andreas
    data:
      title: ⚠️ Kostal-Zähler gesprungen
      message: >-
        {{ trigger.to_state.name }} fiel {% if trigger.from_state and trigger.from_state.state | is_number %}von
        {{ trigger.from_state.state | float(0) | round(1) | string | replace('.', ',') }} {% endif %}auf
        {{ trigger.to_state.state | float(0) | round(1) | string | replace('.', ',') }} kWh
        ({{ now().strftime('%d.%m. %H:%M') }}). Wenn der Wert zurückspringt, ist die Statistik in der Stunde danach
        falsch: Entwicklerwerkzeuge → Statistiken → {{ trigger.entity_id }} → Summe anpassen.
      data:
        url: /developer-tools/statistics
        tag: kostal-zaehlersprung
  mode: queued
  max: 10
- id: '1795002600004'
  alias: 'Tarif: Vertragswechsel übernehmen'
  description: >-
    Ab dem Beginn des nächsten Vertrags (input_datetime.tarifwechsel_ab) werden Anbieter, Preise, Abschlag,
    Mindestlaufzeit und Kündigungsfrist in den aktuellen Vertrag geschrieben; danach werden die Felder
    „Nächster Vertrag“ geleert. Läuft täglich kurz nach Mitternacht, beim Start und 3 Minuten nach einer
    Eingabe, wenn der Beginn schon in der Vergangenheit liegt (nachträglich eingetragen). Ein Beginn „heute“
    wird nur über den Mitternachts-Lauf übernommen, weil das Datumsfeld neu angelegt auf heute steht.
    Felder mit 0 bleiben unverändert.
  triggers:
  - trigger: time
    at: 00:00:30
  - trigger: homeassistant
    event: start
  - trigger: state
    id: eingabe
    entity_id:
    - input_datetime.tarifwechsel_ab
    - input_text.vertrag_neu_anbieter
    - input_number.tarif_neu_arbeitspreis_ct
    - input_number.tarif_neu_grundpreis_jahr
    - input_number.tarif_neu_abschlag_monat
    - input_select.vertrag_neu_laufzeit
    - input_number.vertrag_neu_kuendigungsfrist_monate
  conditions:
  - condition: template
    value_template: >-
      {% set ab = states('input_datetime.tarifwechsel_ab') %}
      {% set heute = now().strftime('%Y-%m-%d') %}
      {{ ab | regex_match('^[0-9]{4}-[0-9]{2}-[0-9]{2}')
         and (ab[:10] < heute if trigger.id == 'eingabe' else ab[:10] <= heute)
         and (states('input_number.tarif_neu_arbeitspreis_ct') | float(0) > 0
              or states('input_number.tarif_neu_grundpreis_jahr') | float(0) > 0
              or states('input_number.tarif_neu_abschlag_monat') | float(0) > 0
              or states('input_text.vertrag_neu_anbieter') | trim not in ['', 'unknown', 'unavailable']) }}
  actions:
  - if:
    - condition: trigger
      id: eingabe
    then:
    - delay: 00:03:00
    - condition: template
      value_template: >-
        {% set ab = states('input_datetime.tarifwechsel_ab') %}
        {{ ab | regex_match('^[0-9]{4}-[0-9]{2}-[0-9]{2}') and ab[:10] < now().strftime('%Y-%m-%d') }}
  - variables:
      ab: "{{ states('input_datetime.tarifwechsel_ab')[:10] }}"
      anbieter_neu: "{{ states('input_text.vertrag_neu_anbieter') | trim }}"
      ap_neu: "{{ states('input_number.tarif_neu_arbeitspreis_ct') | float(0) }}"
      gp_neu: "{{ states('input_number.tarif_neu_grundpreis_jahr') | float(0) }}"
      ab_neu: "{{ states('input_number.tarif_neu_abschlag_monat') | float(0) }}"
      lz_neu: "{{ states('input_select.vertrag_neu_laufzeit') }}"
      kf_neu: "{{ states('input_number.vertrag_neu_kuendigungsfrist_monate') | int(0) }}"
      ap_alt: "{{ states('input_number.tarif_fix_arbeitspreis_ct') | float(0) }}"
      gp_alt: "{{ states('input_number.tarif_fix_grundpreis_jahr') | float(0) }}"
      ab_alt: "{{ states('input_number.abschlag_monat') | float(0) }}"
      ende: >-
        {% from 'vertrag.jinja' import vertrag_ende %}{{ vertrag_ende(states('input_datetime.tarifwechsel_ab'), states('input_select.vertrag_neu_laufzeit')) | trim }}
      kuendigen: >-
        {% from 'vertrag.jinja' import vertrag_ende, kuendigen_bis %}{{ kuendigen_bis(vertrag_ende(states('input_datetime.tarifwechsel_ab'), states('input_select.vertrag_neu_laufzeit')) | trim, states('input_number.vertrag_neu_kuendigungsfrist_monate')) | trim }}
  - if:
    - condition: template
      value_template: "{{ ap_neu > 0 }}"
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.tarif_fix_arbeitspreis_ct
      data:
        value: "{{ ap_neu }}"
  - if:
    - condition: template
      value_template: "{{ gp_neu > 0 }}"
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.tarif_fix_grundpreis_jahr
      data:
        value: "{{ gp_neu }}"
  - if:
    - condition: template
      value_template: "{{ ab_neu > 0 }}"
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.abschlag_monat
      data:
        value: "{{ ab_neu }}"
  - if:
    - condition: template
      value_template: "{{ anbieter_neu not in ['', 'unknown', 'unavailable'] }}"
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.vertrag_anbieter
      data:
        value: "{{ anbieter_neu }}"
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.vertrag_beginn
    data:
      date: "{{ ab }}"
  - action: input_select.select_option
    target:
      entity_id: input_select.vertrag_laufzeit
    data:
      option: "{{ lz_neu }}"
  - action: input_number.set_value
    target:
      entity_id: input_number.vertrag_kuendigungsfrist_monate
    data:
      value: "{{ kf_neu }}"
  - action: notify.mobile_app_iphone_andreas
    data:
      title: "\U0001F4B6 Neuer Stromvertrag aktiv{{ ' – ' ~ anbieter_neu if anbieter_neu not in ['', 'unknown', 'unavailable'] }}"
      message: >-
        Ab {{ ab[8:10] }}.{{ ab[5:7] }}.{{ ab[:4] }}:
        Arbeitspreis {{ ap_alt | string | replace('.', ',') }} → {{ (ap_neu if ap_neu > 0 else ap_alt) | string | replace('.', ',') }} ct/kWh{{ ' (nicht eingetragen!)' if ap_neu == 0 }},
        Grundpreis {{ gp_alt | string | replace('.', ',') }} → {{ (gp_neu if gp_neu > 0 else gp_alt) | string | replace('.', ',') }} €/Jahr{{ ' (nicht eingetragen!)' if gp_neu == 0 }},
        Abschlag {{ ab_alt | int }} → {{ (ab_neu if ab_neu > 0 else ab_alt) | int }} €/Monat{{ ' (nicht eingetragen!)' if ab_neu == 0 }}.
        {% if ende %}Mindestlaufzeit {{ lz_neu }} bis {{ ende[8:10] }}.{{ ende[5:7] }}.{{ ende[:4] }}, kündigen bis {{ kuendigen[8:10] }}.{{ kuendigen[5:7] }}.{{ kuendigen[:4] }}.{% endif %}
      data:
        url: /dashboard-energie/monate
        tag: tarifwechsel
  - action: input_number.set_value
    target:
      entity_id:
      - input_number.tarif_neu_arbeitspreis_ct
      - input_number.tarif_neu_grundpreis_jahr
      - input_number.tarif_neu_abschlag_monat
    data:
      value: 0
  - action: input_text.set_value
    target:
      entity_id: input_text.vertrag_neu_anbieter
    data:
      value: ''
  mode: single
  max_exceeded: silent
- id: '1795002600005'
  alias: 'Tarif: Kündigungsfrist Stromvertrag'
  description: >-
    Erinnert 60, 30, 14, 7 und 1 Tag(e) vor dem letzten Kündigungstag der Mindestlaufzeit
    (sensor.vertrag_kundigen_bis) – Zeit zum Preisvergleich.
  triggers:
  - trigger: time
    at: 09:00:00
  conditions:
  - condition: template
    value_template: "{{ states('sensor.vertrag_tage_bis_kundigungsfrist') | int(-1) in [60, 30, 14, 7, 1] }}"
  actions:
  - variables:
      k: "{{ states('sensor.vertrag_kundigen_bis') }}"
      e: "{{ states('sensor.vertrag_ende') }}"
  - action: notify.mobile_app_iphone_andreas
    data:
      title: "⏳ Stromvertrag: noch {{ states('sensor.vertrag_tage_bis_kundigungsfrist') }} Tage bis zur Kündigungsfrist"
      message: >-
        {% set a = states('input_text.vertrag_anbieter') | trim %}{{ a if a not in ['', 'unknown', 'unavailable'] else 'Stromvertrag' }}: Mindestlaufzeit endet am
        {{ e[8:10] }}.{{ e[5:7] }}.{{ e[:4] }}, Kündigung muss bis {{ k[8:10] }}.{{ k[5:7] }}.{{ k[:4] }} beim Anbieter sein.
        Jetzt Preise vergleichen – danach meist monatlich kündbar, aber die Preisgarantie läuft aus.
      data:
        url: /dashboard-energie/monate
        tag: vertrag-kuendigung
  mode: single
