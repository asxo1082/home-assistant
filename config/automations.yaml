    - unknown
    for: 00:02:00
    id: aus
  - trigger: state
    entity_id:
    - sensor.ap_wohnzimmer_zustand
    - sensor.ap_hwr_zustand
    - sensor.ap_gartenhaus_zustand
    - sensor.ap_dachboden_zustand
    - sensor.ap_garage_zustand
    from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
    id: an
  conditions:
  - condition: state
    entity_id: binary_sensor.raspberry_15
    state: 'on'
    for: 00:05:00
  actions:
  - variables:
      ap: '{{ trigger.to_state.name | replace('' Zustand'','''') }}'
  - choose:
    - conditions:
