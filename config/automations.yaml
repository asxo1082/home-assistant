- id: '1791281393453'
  alias: 'Wallbox: Modus-Steuerung KEBA'
  description: >-
    Hauptschalter: "Automatik Aus" = Wallbox frei mit 16 A (einmalig beim Umschalten,
    danach greift HA nicht mehr ein). "Stop / Sperren" = Wallbox gesperrt.
    "Automatik An" = der Lade-Modus entscheidet. Der Zielstrom wird an einer Stelle berechnet.
  triggers:
  - trigger: state
    entity_id: input_select.energie_modus
    id: hauptschalter
  - trigger: state
    entity_id:
    - input_select.wallbox
    - binary_sensor.pv_laden_freigabe
    - binary_sensor.tibber_laden_freigabe
    - input_boolean.tibber_tarif_aktiv
    - input_number.sofort_laden_kw
    id: sonstige
  - trigger: time_pattern
    minutes: /1
    id: sonstige
  - trigger: homeassistant
    event: start
    id: sonstige
  variables:
    hauptschalter: "{{ states('input_select.energie_modus') }}"
    ziel_ampere: >-
      {% set m = states('input_select.wallbox') %}
      {% set pv_ok = is_state('binary_sensor.pv_laden_freigabe', 'on') %}
      {% set tib_ok = is_state('binary_sensor.tibber_laden_freigabe', 'on') %}
      {% set tarif = is_state('input_boolean.tibber_tarif_aktiv', 'on') %}
      {% set a_max = [16, [6, (states('input_number.sofort_laden_kw') | float(11) * 1000 / 690) | round(0) | int] | max] | min %}
      {% set a_pv = [16, [6, (states('sensor.pv_ueberschuss_wallbox') | float(0) / 690) | int] | max] | min %}
      {% if m == 'Sofort laden (Max 11 kW)' %}{{ a_max }}
      {% elif m == 'PV-Ueberschuss' %}{{ a_pv if pv_ok else 0 }}
      {% elif m == 'Smart (Tibber Tiefpreis)' %}{{ a_max if tib_ok else 0 }}
      {% elif m == 'Automatisch' %}{{ a_pv if pv_ok else (a_max if (tarif and tib_ok) else 0) }}
      {% else %}0{% endif %}
  actions:
  - choose:
    - alias: Automatik Aus – Wallbox einmalig freigeben
      conditions:
      - "{{ hauptschalter == 'Automatik Aus' and trigger.id == 'hauptschalter' }}"
      sequence:
      - action: keba.set_current
        data:
          current: 16
      - action: keba.enable
    - alias: Stop / Sperren – Wallbox gesperrt
      conditions:
      - "{{ hauptschalter == 'Stop / Sperren' }}"
      sequence:
      - action: keba.disable
    - alias: Automatik An – laden
      conditions:
      - "{{ hauptschalter == 'Automatik An' and (ziel_ampere | int(0)) >= 6 }}"
      sequence:
      - action: keba.set_current
        data:
          current: "{{ ziel_ampere | int }}"
      - action: keba.enable
    - alias: Automatik An – nicht laden
      conditions:
      - "{{ hauptschalter == 'Automatik An' }}"
      sequence:
      - action: keba.disable
  mode: restart
- id: '1791456198847'
  alias: 'Speicher: Steuerung Kostal'
  description: >-
    Schreibt Register 1034 (Lade-/Entladesollwert, negativ = laden).
    Freigabe = einmalig 0 W schreiben, danach nichts mehr, damit der Kostal nach
    seiner Rückfallzeit in die interne Regelung zurückgeht. Hold und Netzladen
    werden alle 30 s erneuert. Netzladen schaltet sich am Ziel-Ladestand selbst ab.
  triggers:
  - trigger: state
    entity_id:
    - input_select.energie_modus
    - input_select.batterie_modus
    - input_boolean.entladeschutz_autoladen
    id: wechsel
  - trigger: homeassistant
    event: start
    id: wechsel
  - trigger: time_pattern
    seconds: /30
    id: takt
  variables:
    hauptschalter: "{{ states('input_select.energie_modus') }}"
    modus: "{{ states('input_select.batterie_modus') }}"
    soc_ok: "{{ states('sensor.plenticoreseelen_battery_soc') | is_number }}"
    soc: "{{ states('sensor.plenticoreseelen_battery_soc') | float(0) }}"
    soc_max: "{{ states('input_number.netzladen_max_soc') | float(80) }}"
    auto_laedt: "{{ states('sensor.keba_p30_charging_power') | float(0) > 1 }}"
    schutz: "{{ is_state('input_boolean.entladeschutz_autoladen', 'on') }}"
    werte:
      '500':
      - 0
      - 50170
      '1000':
      - 0
      - 50298
      '1500':
      - 32768
      - 50363
      '2000':
      - 0
      - 50426
      '2500':
      - 16384
      - 50460
    ladewert: "{{ werte.get(states('input_select.netzladeleistung'), werte['1000']) }}"
  actions:
  - choose:
    - alias: Freigabe – HA greift nicht ein
      conditions:
      - >-
        {{ hauptschalter != 'Automatik An'
           or (modus == 'Automatik' and not (schutz and auto_laedt)) }}
      sequence:
      - if:
        - "{{ trigger.id == 'wechsel' }}"
        then:
        - action: modbus.write_register
          continue_on_error: true
          data:
            hub: kostal
            slave: 71
            address: 1034
            value:
            - 0
            - 0
    - alias: Entladeschutz – Auto lädt, Batterie halten
      conditions:
      - "{{ modus == 'Automatik' and schutz and auto_laedt }}"
      sequence:
      - action: modbus.write_register
        continue_on_error: true
        data:
          hub: kostal
          slave: 71
          address: 1034
          value:
          - 0
          - 0
    - alias: Entladung sperren (Hold)
      conditions:
      - "{{ modus == 'Entladung sperren (Hold)' }}"
      sequence:
      - action: modbus.write_register
        continue_on_error: true
        data:
          hub: kostal
          slave: 71
          address: 1034
          value:
          - 0
          - 0
    - alias: Netzladen – Ladestand unbekannt, sicherheitshalber halten
      conditions:
      - "{{ modus == 'Netzladen erzwingen' and not soc_ok }}"
      sequence:
      - action: modbus.write_register
        continue_on_error: true
        data:
          hub: kostal
          slave: 71
          address: 1034
          value:
          - 0
          - 0
    - alias: Netzladen – laden
      conditions:
      - "{{ modus == 'Netzladen erzwingen' and soc < soc_max }}"
      sequence:
      - action: modbus.write_register
        continue_on_error: true
        data:
          hub: kostal
          slave: 71
          address: 1034
          value: "{{ ladewert }}"
    - alias: Netzladen – Ziel erreicht, zurück auf Automatik
      conditions:
      - "{{ modus == 'Netzladen erzwingen' }}"
      sequence:
      - action: modbus.write_register
        continue_on_error: true
        data:
          hub: kostal
          slave: 71
          address: 1034
          value:
          - 0
          - 0
      - action: notify.mobile_app_iphone_andreas
        continue_on_error: true
        data:
          title: "\U0001F50B Netzladen beendet"
          message: "Ladestand {{ soc | round(0) | int }} % erreicht. Speicher-Modus steht wieder auf Automatik."
      - action: input_select.select_option
        target:
          entity_id: input_select.batterie_modus
        data:
          option: Automatik
  mode: restart
