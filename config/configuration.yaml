sensor:
  - platform: integration
    source: sensor.kosten_dynamisch_pro_stunde
    name: "Kosten dynamisch gesamt"
    unique_id: kosten_dynamisch_gesamt
    unit_time: h
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.kosten_fix_pro_stunde
    name: "Kosten fix gesamt"
    unique_id: kosten_fix_gesamt
    unit_time: h
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: statistics
    name: "Ladung kWh 24h Statistik"
    unique_id: ladung_kwh_24h_statistik
    entity_id: sensor.keba_p30_total_energy
    state_characteristic: change
    max_age:
      hours: 24
    sampling_size: 25000
    keep_last_sample: true
    precision: 2

  - platform: integration
    source: sensor.verdienst_einspeisung_pro_stunde
    name: "Verdienst Einspeisung gesamt"
    unique_id: verdienst_einspeisung_gesamt
    unit_time: h
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.einspeisung_leistung_kw
    name: "Einspeisung gesamt kWh"
    unique_id: einspeisung_gesamt_kwh
    unit_time: h
    round: 3
    method: left
    max_sub_interval:
      minutes: 5


utility_meter:
  klima_kwh_jahr:
    source: sensor.garage_klima_energie
    cycle: yearly
  klima_kwh_monat:
    source: sensor.garage_klima_energie
    cycle: monthly
  kosten_dyn_tag:
    source: sensor.kosten_dynamisch_gesamt
    cycle: daily
  kosten_dyn_woche:
