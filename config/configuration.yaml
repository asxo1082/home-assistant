      - action: nordpool.get_prices_for_date
        data:
          config_entry: 01M4D9KB3ATP7KX0QCVZK20SC4
          date: "{{ now().date() }}"
          areas: GER
          currency: EUR
        response_variable: preise_heute
      - action: nordpool.get_prices_for_date
        continue_on_error: true
        data:
          config_entry: 01M4D9KB3ATP7KX0QCVZK20SC4
          date: "{{ now().date() + timedelta(days=1) }}"
