            {{ ns.l }}
          morgen: >
            {% set zuschlag = (states('input_number.preis_aufschlag_ct') | float(0) + states('input_number.preis_netz_umlagen_ct') | float(0) + states('input_number.preis_stromsteuer_ct') | float(0)) / 100 %}
            {% set mwst = 1 + states('input_number.preis_mwst') | float(0) / 100 %}
            {% set liste = preise_morgen['GER'] if preise_morgen is defined and preise_morgen is mapping and 'GER' in preise_morgen else [] %}
            {% set ns = namespace(l=[]) %}
            {% for p in liste %}
              {% set netto = p.price / 1000 %}
              {% set ns.l = ns.l + [[(as_timestamp(p.start) * 1000) | int, netto | round(4), ((netto + zuschlag) * mwst) | round(4)]] %}
            {% endfor %}
            {{ ns.l }}

