  - trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: calendar.google_kalender
    action:
      - action: calendar.get_events
        target:
          entity_id: calendar.google_kalender
        data:
          duration:
            days: 7
        response_variable: ev
    sensor:
      - name: "Termine Woche"
        unique_id: termine_woche
        state: "{{ ev['calendar.google_kalender'].events | count }}"
        attributes:
          text: >
            {% set wt = ['Mo','Di','Mi','Do','Fr','Sa','So'] %}
            {% set heute = now().strftime('%Y-%m-%d') %}
            {% set morgen = (now() + timedelta(days=1)).strftime('%Y-%m-%d') %}
            {% set ns = namespace(l=[]) %}
            {% for e in ev['calendar.google_kalender'].events[:6] %}
              {% set d = e.start[:10] %}
              {% set tag = 'Heute' if d == heute else ('Morgen' if d == morgen else wt[as_datetime(d).weekday()] ~ ' ' ~ d[8:10] ~ '.' ~ d[5:7] ~ '.') %}
              {% set zeit = e.start[11:16] if e.start | length > 10 else 'ganztägig' %}
              {% set ns.l = ns.l + [tag ~ ' · ' ~ zeit ~ ' · ' ~ e.summary] %}
            {% endfor %}
            {{ ns.l | join('\n') if ns.l | count > 0 else 'Keine Termine in den nächsten 7 Tagen' }}

  # Müllkalender (Waste Collection Schedule / Schönmackers) – nächste Abfuhr je Tonne
  - trigger:
      - trigger: time_pattern
        hours: "/1"
      - trigger: time
        at: "00:01:00"
      - trigger: time
        at: "12:00:30"
      - trigger: homeassistant
        event: start
    action:
      - action: calendar.get_events
        target:
          entity_id: >-
            {{ integration_entities('waste_collection_schedule')
               | select('match', 'calendar\\.') | list }}
        data:
          start_date_time: "{{ today_at('00:00') }}"
          duration:
            days: 40
        response_variable: muell_ev
      - variables:
          muell: >
            {% set typen = {'Restabfall': 'rest', 'Bioabfall': 'bio', 'Papier': 'papier', 'Leichtverpackungen': 'gelb'} %}
            {% set ns = namespace(d={}, l=[]) %}
            {% for cal in (muell_ev.values() | list if muell_ev is mapping else []) %}
              {% set ns.l = ns.l + (cal.get('events', []) | list) %}
            {% endfor %}
            {% for e in ns.l | sort(attribute='start') %}
              {% for name, key in typen.items() %}
                {% set tag = e.start[:10] %}
                {% set tage = (strptime(tag, '%Y-%m-%d').date() - now().date()).days %}
                {# Heutige Abfuhr gilt ab 12 Uhr als erledigt #}
                {% if name in e.summary and key not in ns.d and tage >= 0 and not (tage == 0 and now().hour >= 12) %}
                  {% set ns.d = ns.d | combine({key: {'datum': tag, 'tage': tage}}) %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ ns.d }}
    sensor:
      - name: "Müll Nächste Abfuhr"
        unique_id: muell_naechste_abfuhr
        icon: mdi:trash-can
        unit_of_measurement: "Tage"
        state: >
          {% set t = muell.values() | map(attribute='tage') | list %}
          {{ t | min if t else 'unknown' }}
        attributes:
          rest: "{{ muell.get('rest') }}"
          bio: "{{ muell.get('bio') }}"
          papier: "{{ muell.get('papier') }}"
          gelb: "{{ muell.get('gelb') }}"
          heute: >
            {% set n = {'rest': 'Restabfall', 'bio': 'Bioabfall', 'papier': 'Papier', 'gelb': 'Gelbe Tonne'} %}
            {% set ns = namespace(l=[]) %}
            {% for k, v in muell.items() if v.tage == 0 %}{% set ns.l = ns.l + [n[k]] %}{% endfor %}
            {{ ns.l | join(', ') }}
          morgen: >
            {% set n = {'rest': 'Restabfall', 'bio': 'Bioabfall', 'papier': 'Papier', 'gelb': 'Gelbe Tonne'} %}
            {% set ns = namespace(l=[]) %}
            {% for k, v in muell.items() if v.tage == 1 %}{% set ns.l = ns.l + [n[k]] %}{% endfor %}
            {{ ns.l | join(', ') }}
          text: >
            {% set n = {'rest': '⚫ Restabfall', 'bio': '🟤 Bioabfall', 'papier': '🔵 Papier', 'gelb': '🟡 Gelbe Tonne'} %}
            {% set wt = ['Mo','Di','Mi','Do','Fr','Sa','So'] %}
            {% set ns = namespace(l=[]) %}
            {% for k, v in muell.items() | sort(attribute='1.tage') %}
              {% set d = strptime(v.datum, '%Y-%m-%d') %}
              {% set wann = 'heute' if v.tage == 0 else ('morgen' if v.tage == 1 else 'in ' ~ v.tage ~ ' Tagen') %}
              {% set ns.l = ns.l + [n[k] ~ ' · ' ~ wt[d.weekday()] ~ ' ' ~ d.strftime('%d.%m.') ~ ' · ' ~ wann] %}
            {% endfor %}
            {{ ns.l | join('\n') if ns.l else 'Keine Termine gefunden' }}

  - trigger:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    action:
      - action: recorder.get_statistics
        data:
          statistic_ids:
            - sensor.keba_p30_total_energy
          start_time: "{{ now().year - 1 }}-01-01 00:00:00"
          period: month
          types:
            - change
            - state
        response_variable: ladung_stats
      - variables:
          lm: >
            {# Manuelle Korrekturwerte (kWh) je Monat - bei neuem Monat ggf. ergänzen/anpassen #}
            {% set korr = {'2026-07': 126.63, '2026-08': 448.66, '2026-09': 393.83, '2026-10': 113.66} %}
            {% set d = ladung_stats['statistics'] if ladung_stats is mapping and 'statistics' in ladung_stats else ladung_stats %}
            {% set liste = d.get('sensor.keba_p30_total_energy', []) if d is mapping else [] %}
            {% set live = states('sensor.keba_p30_total_energy') | float(0) %}
            {% set jetzt = now() %}
            {% set ym_akt = '%04d-%02d' | format(jetzt.year, jetzt.month) %}
            {% set letzter = jetzt.replace(day=1) - timedelta(days=1) %}
            {% set ym_letzt = '%04d-%02d' | format(letzter.year, letzter.month) %}
            {% set vorletzter = letzter.replace(day=1) - timedelta(days=1) %}
            {% set ym_vorletzt = '%04d-%02d' | format(vorletzter.year, vorletzter.month) %}
            {% set ns = namespace(akt=0, letzt=0, vorletzt=0, jahr=0, vorjahr=0, basis=none, m={}) %}
            {% for b in liste %}
              {% set ym = as_timestamp(b.start) | timestamp_custom('%Y-%m') %}
              {% set ch = b.change | float(0) %}
              {% set ns.m = ns.m | combine({ym: ch}) %}
              {% if ym == ym_akt %}
                {% set ns.akt = ch %}
                {% set ns.basis = b.state | float(0) %}
              {% endif %}
              {% if ym == ym_letzt %}
                {% set ns.letzt = ch %}
              {% endif %}
              {% if ym == ym_vorletzt %}
                {% set ns.vorletzt = ch %}
              {% endif %}
              {% if ym[:4] | int == jetzt.year %}
                {% set ns.jahr = ns.jahr + ch %}
              {% endif %}
              {% if ym[:4] | int == jetzt.year - 1 %}
                {% set ns.vorjahr = ns.vorjahr + ch %}
              {% endif %}
            {% endfor %}
            {% for key, wert in korr.items() %}
              {% set ns.m = ns.m | combine({key: ((ns.m.get(key, 0) + wert) | round(2))}) %}
              {% if key == ym_akt %}
                {% set ns.akt = ns.akt + wert %}
              {% endif %}
              {% if key == ym_letzt %}
                {% set ns.letzt = ns.letzt + wert %}
              {% endif %}
              {% if key == ym_vorletzt %}
                {% set ns.vorletzt = ns.vorletzt + wert %}
              {% endif %}
              {% if key[:4] | int == jetzt.year %}
                {% set ns.jahr = ns.jahr + wert %}
              {% endif %}
              {% if key[:4] | int == jetzt.year - 1 %}
                {% set ns.vorjahr = ns.vorjahr + wert %}
              {% endif %}
            {% endfor %}
            {% set zusatz = (live - ns.basis) if (ns.basis is not none and live >= ns.basis) else 0 %}
            {% set ns.m = ns.m | combine({ym_akt: ((ns.m.get(ym_akt, 0) + zusatz) | round(2))}) %}
            {{ {'akt': ((ns.akt + zusatz) | round(2)), 'letzt': (ns.letzt | round(2)), 'vorletzt': (ns.vorletzt | round(2)), 'jahr': ((ns.jahr + zusatz) | round(2)), 'vorjahr': (ns.vorjahr | round(2)), 'monate': ns.m} }}
    sensor:
      - name: "Ladung Statistik Perioden"
        unique_id: ladung_statistik_perioden
        unit_of_measurement: "kWh"
        state: "{{ lm.akt }}"
        attributes:
          aktueller_monat: "{{ lm.akt }}"
          letzter_monat: "{{ lm.letzt }}"
          vorletzter_monat: "{{ lm.vorletzt }}"
          jahr_aktuell: "{{ lm.jahr }}"
          jahr_letztes: "{{ lm.vorjahr }}"
          monate: "{{ lm.monate }}"

