# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

keba:
  # TODO: IP im UniFi prüfen (.88 vs. .89 Wallbox mit zwei MACs) und feste IP/DHCP-Reservierung setzen
  host: 192.168.1.88
  refresh_interval: 5

modbus:
  - name: kostal
    type: tcp
    host: 192.168.1.225
    port: 1502
    delay: 2
    timeout: 5
    sensors:
      - name: "Kostal Modbus Test AC Leistung"
        unique_id: kostal_modbus_test_ac_leistung
        slave: 71
        address: 172
        input_type: holding
        data_type: float32
        swap: word
        unit_of_measurement: "W"
        scan_interval: 30

input_select:
  energie_modus:
    name: "Energie Automatik"
    options:
      - "Automatik Aus"
      - "Automatik An"
      - "Stop / Sperren"
    # Kein initial mehr: nach einem Neustart gilt wieder der letzte Zustand.
    # "Automatik Aus" bedeutet: HA greift nicht ein (Wallbox frei, Kostal intern) – das ist kein sicherer Standard.
    icon: mdi:robot
  netzladeleistung:
    name: "Netzladeleistung (W)"
    options: ["500", "1000", "1500", "2000", "2500"]
    icon: mdi:battery-charging
  ladung_zeitraum:
    name: "Ladung Zeitraum"
    options:
      - "Aktueller Monat"
      - "Letzter Monat"
      - "Vorletzter Monat"
      - "Gesamt aktuelles Jahr"
      - "Gesamt letztes Jahr"
    icon: mdi:calendar-month

input_boolean:
  entladeschutz_autoladen:
    name: "Batterie nicht ins Auto entladen"
    icon: mdi:battery-lock

input_number:
  tibber_max_preis:
    name: "Tibber: Max-Preis zum Laden"
    min: 0.05
    max: 0.50
    step: 0.01
    unit_of_measurement: "€/kWh"
    mode: slider
  netzladen_max_soc:
    name: "Netzladen bis Ladestand"
    min: 20
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
  sofort_laden_kw:
    name: "Sofort laden: Ladeleistung"
    min: 4
    max: 11
    step: 1
    unit_of_measurement: "kW"
    mode: slider
    icon: mdi:ev-station
  preis_aufschlag_ct:
    name: "Tibber Aufschlag"
    min: 0
    max: 10
    step: 0.01
    unit_of_measurement: "ct/kWh"
    mode: box
  preis_netz_umlagen_ct:
    name: "Netzentgelt, Konzessionsabgabe, Umlagen"
    min: 0
    max: 30
    step: 0.01
    unit_of_measurement: "ct/kWh"
    mode: box
  preis_stromsteuer_ct:
    name: "Stromsteuer"
    min: 0
    max: 5
    step: 0.01
    unit_of_measurement: "ct/kWh"
    mode: box
  preis_mwst:
    name: "Mehrwertsteuer"
    min: 0
    max: 25
    step: 0.1
    unit_of_measurement: "%"
    mode: box
  tarif_fix_arbeitspreis_ct:
    name: "Fixtarif Arbeitspreis (brutto)"
    min: 0
    max: 80
    step: 0.01
    unit_of_measurement: "ct/kWh"
    mode: box
  tarif_fix_grundpreis_jahr:
    name: "Fixtarif Grundpreis (brutto)"
    min: 0
    max: 600
    step: 0.01
    unit_of_measurement: "€/Jahr"
    mode: box
  tibber_grundgebuehr_monat:
    name: "Tibber Grundgebühr"
    min: 0
    max: 30
    step: 0.01
    unit_of_measurement: "€/Monat"
    mode: box
  tarif_einspeiseverguetung_ct:
    name: "Einspeisevergütung"
    min: 0
    max: 30
    step: 0.01
    unit_of_measurement: "ct/kWh"
    mode: box
    icon: mdi:transmission-tower-export
  winter_verbrauch_kwh_monat:
    name: "Winter-Verbrauch (Schätzung)"
    min: 0
    max: 3000
    step: 10
    unit_of_measurement: "kWh/Monat"
    mode: box
    icon: mdi:snowflake
  abschlag_monat:
    name: "Monatlicher Abschlag"
    min: 0
    max: 2000
    step: 1
    unit_of_measurement: "€/Monat"
    mode: box
    icon: mdi:cash-register

template:
  - sensor:
      - name: "PV Ueberschuss Wallbox"
        unique_id: pv_ueberschuss_wallbox
        unit_of_measurement: "W"
        device_class: power
        availability: >
          {{ states('sensor.plenticoreseelen_grid_power') | is_number
             and states('sensor.keba_p30_charging_power') | is_number }}
        state: >
          {% set netz = states('sensor.plenticoreseelen_grid_power') | float(0) %}
          {% set wallbox = states('sensor.keba_p30_charging_power') | float(0) * 1000 %}
          {{ (wallbox - netz) | round(0) }}

      - name: "PV Erzeugung"
        unique_id: pv_erzeugung
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.plenticoreseelen_sum_power_of_all_pv_dc_inputs') | is_number }}"
        state: >
          {% set dc = states('sensor.plenticoreseelen_sum_power_of_all_pv_dc_inputs') | float(0) %}
          {{ [dc, 0] | max | round(0) }}

      # Sonnenstrom-Ampel: grün ab 2.000 W Überschuss (oder ab 1.200 W bei Speicher ≥ 90 %), gelb ab 800 W, sonst rot
      - name: "Sonnenstrom Überschuss"
        unique_id: sonnenstrom_uberschuss
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.pv_erzeugung') | is_number
             and states('sensor.plenticoreseelen_home_power') | is_number }}
        state: >
          {{ (states('sensor.pv_erzeugung') | float(0)
              - states('sensor.plenticoreseelen_home_power') | float(0)) | round(0) }}

      - name: "Sonnenstrom Ampel"
        unique_id: sonnenstrom_ampel
        icon: mdi:traffic-light
        availability: "{{ states('sensor.sonnenstrom_uberschuss') | is_number }}"
        state: >
          {% set u = states('sensor.sonnenstrom_uberschuss') | float(0) %}
          {% set soc = states('sensor.plenticoreseelen_battery_soc') | float(0) %}
          {% if u >= 2000 or (u >= 1200 and soc >= 90) %}gruen
          {% elif u >= 800 %}gelb
          {% else %}rot{% endif %}

      - name: "Strompreis Tibber berechnet"
        unique_id: strompreis_tibber_berechnet
        unit_of_measurement: "€/kWh"
        state_class: measurement
        availability: "{{ states('sensor.nord_pool_ger_aktueller_preis') | is_number }}"
        state: >
          {% set boerse = states('sensor.nord_pool_ger_aktueller_preis') | float(0) %}
          {% set aufschlag = states('input_number.preis_aufschlag_ct') | float(0) / 100 %}
          {% set netz = states('input_number.preis_netz_umlagen_ct') | float(0) / 100 %}
          {% set steuer = states('input_number.preis_stromsteuer_ct') | float(0) / 100 %}
          {% set mwst = 1 + states('input_number.preis_mwst') | float(0) / 100 %}
          {{ ((boerse + aufschlag + netz + steuer) * mwst) | round(4) }}

      - name: "Netzbezug Leistung kW"
        unique_id: netzbezug_leistung_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.plenticoreseelen_grid_power') | is_number }}"
        state: >
          {% set w = states('sensor.plenticoreseelen_grid_power') | float(0) %}
          {{ (([w, 0] | max) / 1000) | round(3) }}

      - name: "Kosten dynamisch pro Stunde"
        unique_id: kosten_dynamisch_pro_stunde
        unit_of_measurement: "EUR/h"
        state_class: measurement
        state: >
          {% set kw = states('sensor.netzbezug_leistung_kw') | float(0) %}
          {% set preis = states('sensor.strompreis_tibber_berechnet') | float(0) %}
          {% set grund = states('input_number.tibber_grundgebuehr_monat') | float(0) * 12 / 8760 %}
          {{ (kw * preis + grund) | round(5) }}

      - name: "Kosten fix pro Stunde"
        unique_id: kosten_fix_pro_stunde
        unit_of_measurement: "EUR/h"
        state_class: measurement
        state: >
          {% set kw = states('sensor.netzbezug_leistung_kw') | float(0) %}
          {% set preis = states('input_number.tarif_fix_arbeitspreis_ct') | float(0) / 100 %}
          {% set grund = states('input_number.tarif_fix_grundpreis_jahr') | float(0) / 8760 %}
          {{ (kw * preis + grund) | round(5) }}

      - name: "Saldo Differenz Monat"
        unique_id: saldo_differenz_monat
        unit_of_measurement: "EUR"
        state: >
          {% set fix = states('sensor.saldo_monat_fix') | float(0) %}
          {% set dyn = states('sensor.saldo_monat_dynamisch') | float(0) %}
          {{ (fix - dyn) | round(2) }}

      - name: "Kosten Differenz gesamt"
        unique_id: kosten_differenz_gesamt
        unit_of_measurement: "EUR"
        state: >
          {% set fix = states('sensor.kosten_fix_gesamt') | float(0) %}
          {% set dyn = states('sensor.kosten_dynamisch_gesamt') | float(0) %}
          {{ (fix - dyn) | round(2) }}

      - name: "Ladung Energie 24h"
        unique_id: ladung_energie_24h
        unit_of_measurement: "kWh"
        state: >
          {% set kwh = states('sensor.ladung_kwh_24h_statistik') | float(0) %}
          {{ ([kwh, 0] | max) | round(2) }}

      - name: "Ladung Kosten 24h"
        unique_id: ladung_kosten_24h
        unit_of_measurement: "EUR"
        state: >
          {% set kwh = states('sensor.ladung_energie_24h') | float(0) %}
          {% set preis = states('input_number.tarif_fix_arbeitspreis_ct') | float(0) / 100 %}
          {{ (kwh * preis) | round(2) }}

      - name: "Ladung Kosten Heute"
        unique_id: ladung_kosten_heute
        unit_of_measurement: "EUR"
        state: >
          {% set kwh = states('sensor.ladung_kwh_tag') | float(0) %}
          {% set preis = states('input_number.tarif_fix_arbeitspreis_ct') | float(0) / 100 %}
          {{ (kwh * preis) | round(2) }}

      - name: "Ladung Kosten Monat"
        unique_id: ladung_kosten_monat
        unit_of_measurement: "EUR"
        state: >
          {% set kwh = state_attr('sensor.ladung_statistik_perioden', 'aktueller_monat') | float(0) %}
          {% set preis = states('input_number.tarif_fix_arbeitspreis_ct') | float(0) / 100 %}
          {{ (kwh * preis) | round(2) }}

      - name: "Ladung Hochrechnung Monat"
        unique_id: ladung_hochrechnung_monat
        unit_of_measurement: "EUR"
        state: >
          {% set jetzt = now() %}
          {% set anfang = jetzt.replace(day=1, hour=0, minute=0, second=0, microsecond=0) %}
          {% set ende = (jetzt.replace(day=28) + timedelta(days=4)).replace(day=1, hour=0, minute=0, second=0, microsecond=0) %}
          {% set tage_monat = (ende - anfang).days %}
          {% set vergangen = (jetzt - anfang).total_seconds() / 86400 %}
          {% set kosten = states('sensor.ladung_kosten_monat') | float(0) %}
          {% if vergangen >= 3 %}
            {{ (kosten / vergangen * tage_monat) | round(2) }}
          {% else %}
            unknown
          {% endif %}

      - name: "Ladung Auswahl Kosten"
        unique_id: ladung_auswahl_kosten
        unit_of_measurement: "EUR"
        state: >
          {% set kwh = states('sensor.ladung_auswahl_kwh') | float(0) %}
          {% set preis = states('input_number.tarif_fix_arbeitspreis_ct') | float(0) / 100 %}
          {{ (kwh * preis) | round(2) }}

      - name: "Preis Netzbezug Fix"
        unique_id: preis_netzbezug_fix
        unit_of_measurement: "€/kWh"
        state_class: measurement
        state: >
          {{ (states('input_number.tarif_fix_arbeitspreis_ct') | float(0) / 100) | round(4) }}

      - name: "Preis Einspeisung"
        unique_id: preis_einspeisung
        unit_of_measurement: "€/kWh"
        state_class: measurement
        state: >
          {{ (states('input_number.tarif_einspeiseverguetung_ct') | float(0) / 100) | round(4) }}

      - name: "Kosten Netzbezug heute"
        unique_id: kosten_netzbezug_heute
        unit_of_measurement: "€"
        state: >
          {% set s = 'sensor.plenticoreseelen_home_consumption_from_grid_day' %}
          {% set e = states(s) | float(0) %}
          {% set kwh = e / 1000 if state_attr(s, 'unit_of_measurement') == 'Wh' else e %}
          {% set preis = states('input_number.tarif_fix_arbeitspreis_ct') | float(0) / 100 %}
          {{ (kwh * preis) | round(2) }}

      - name: "Gutschrift Einspeisung heute"
        unique_id: gutschrift_einspeisung_heute
        unit_of_measurement: "€"
        state: >
          {% set s = 'sensor.plenticoreseelen_energy_to_grid_day' %}
          {% set e = states(s) | float(0) %}
          {% set kwh = e / 1000 if state_attr(s, 'unit_of_measurement') == 'Wh' else e %}
          {% set preis = states('input_number.tarif_einspeiseverguetung_ct') | float(0) / 100 %}
          {{ (kwh * preis) | round(2) }}

      - name: "Strom Saldo heute"
        unique_id: strom_saldo_heute
        unit_of_measurement: "€"
        state: >
          {% set k = states('sensor.kosten_netzbezug_heute') | float(0) %}
          {% set g = states('sensor.gutschrift_einspeisung_heute') | float(0) %}
          {{ (k - g) | round(2) }}

      - name: "Einspeisung Leistung kW"
        unique_id: einspeisung_leistung_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.plenticoreseelen_grid_power') | is_number }}"
        state: >
          {% set w = states('sensor.plenticoreseelen_grid_power') | float(0) %}
          {{ (([-w, 0] | max) / 1000) | round(3) }}

      - name: "Verdienst Einspeisung pro Stunde"
        unique_id: verdienst_einspeisung_pro_stunde
        unit_of_measurement: "EUR/h"
        state_class: measurement
        state: >
          {% set kw = states('sensor.einspeisung_leistung_kw') | float(0) %}
          {% set preis = states('input_number.tarif_einspeiseverguetung_ct') | float(0) / 100 %}
          {{ (kw * preis) | round(5) }}

      - name: "Saldo Monat fix"
        unique_id: saldo_monat_fix
        unit_of_measurement: "EUR"
        state: >
          {% set k = states('sensor.kosten_fix_monat') | float(0) %}
          {% set v = states('sensor.verdienst_monat') | float(0) %}
          {{ (k - v) | round(2) }}

      - name: "Saldo Monat dynamisch"
        unique_id: saldo_monat_dynamisch
        unit_of_measurement: "EUR"
        state: >
          {% set k = states('sensor.kosten_dyn_monat') | float(0) %}
          {% set v = states('sensor.verdienst_monat') | float(0) %}
          {{ (k - v) | round(2) }}

      # Jahreswerte direkt vom Wechselrichter (setzen sich am 1.1. selbst zurück, können nicht springen)
      - name: "Netzbezug kWh Jahr"
        unique_id: netzbezug_kwh_jahr_kostal
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ states('sensor.plenticoreseelen_home_consumption_from_grid_year') | is_number }}"
        state: >
          {% set s = 'sensor.plenticoreseelen_home_consumption_from_grid_year' %}
          {% set e = states(s) | float(0) %}
          {{ ((e / 1000) if state_attr(s, 'unit_of_measurement') == 'Wh' else e) | round(1) }}

      - name: "Einspeisung Jahr kWh"
        unique_id: einspeisung_jahr_kwh_kostal
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ states('sensor.plenticoreseelen_energy_to_grid_year') | is_number }}"
        state: >
          {% set s = 'sensor.plenticoreseelen_energy_to_grid_year' %}
          {% set e = states(s) | float(0) %}
          {{ ((e / 1000) if state_attr(s, 'unit_of_measurement') == 'Wh' else e) | round(1) }}

      - name: "Netzbezug Jahr Kosten"
        unique_id: netzbezug_jahr_kosten
        unit_of_measurement: "€"
        device_class: monetary
        availability: "{{ states('sensor.netzbezug_kwh_jahr') | is_number }}"
        state: >
          {{ (states('sensor.netzbezug_kwh_jahr') | float(0) * states('sensor.preis_netzbezug_fix') | float(0)) | round(2) }}

      - name: "Einspeisung Jahr Verguetung"
        unique_id: einspeisung_jahr_verguetung
        unit_of_measurement: "€"
        device_class: monetary
        availability: "{{ states('sensor.einspeisung_jahr_kwh') | is_number }}"
        state: >
          {{ (states('sensor.einspeisung_jahr_kwh') | float(0) * states('sensor.preis_einspeisung') | float(0)) | round(2) }}

      - name: "Abschlag Jahr bezahlt"
        unique_id: abschlag_jahr_bezahlt
        unit_of_measurement: "€"
        device_class: monetary
        state: >
          {{ (states('input_number.abschlag_monat') | float(0) * now().month) | round(2) }}

      - name: "Grundpreis Jahr anteilig"
        unique_id: grundpreis_jahr_anteilig
        unit_of_measurement: "€"
        device_class: monetary
        state: >
          {{ (states('input_number.tarif_fix_grundpreis_jahr') | float(0) / 12 * now().month) | round(2) }}

      - name: "Guthaben Jahr"
        unique_id: guthaben_jahr
        unit_of_measurement: "€"
        device_class: monetary
        availability: "{{ states('sensor.netzbezug_kwh_jahr') | is_number }}"
        state: >
          {% set a = states('sensor.abschlag_jahr_bezahlt') | float(0) %}
          {% set k = states('sensor.netzbezug_jahr_kosten') | float(0) %}
          {% set g = states('sensor.grundpreis_jahr_anteilig') | float(0) %}
          {{ (a - k - g) | round(2) }}

      - name: "Kosten Jahr Prognose linear"
        unique_id: kosten_jahr_prognose_linear
        unit_of_measurement: "€"
        device_class: monetary
        availability: "{{ states('sensor.netzbezug_kwh_jahr') | is_number }}"
        state: >
          {% set m = now().month %}
          {% set y = now().year %}
          {% set dim = [31, 29 if (y % 4 == 0 and (y % 100 != 0 or y % 400 == 0)) else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {% set done = (m - 1) + (now().day / dim) %}
          {% set k = states('sensor.netzbezug_jahr_kosten') | float(0) %}
          {% set g = states('input_number.tarif_fix_grundpreis_jahr') | float(0) %}
          {{ ((k / done * 12) + g) | round(2) if done > 0 else 0 }}

      - name: "Kosten Jahr Prognose Winter"
        unique_id: kosten_jahr_prognose_winter
        unit_of_measurement: "€"
        device_class: monetary
        availability: "{{ states('sensor.netzbezug_kwh_jahr') | is_number }}"
        state: >
          {% set m = now().month %}
          {% set y = now().year %}
          {% set dim = [31, 29 if (y % 4 == 0 and (y % 100 != 0 or y % 400 == 0)) else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {% set done = (m - 1) + (now().day / dim) %}
          {% set k = states('sensor.netzbezug_jahr_kosten') | float(0) %}
          {% set g = states('input_number.tarif_fix_grundpreis_jahr') | float(0) %}
          {% set rate = states('input_number.winter_verbrauch_kwh_monat') | float(0) %}
          {% set p = states('sensor.preis_netzbezug_fix') | float(0) %}
          {{ (k + (12 - done) * rate * p + g) | round(2) }}

      - name: "Abschlag Jahr gesamt"
        unique_id: abschlag_jahr_gesamt
        unit_of_measurement: "€"
        device_class: monetary
        state: >
          {{ (states('input_number.abschlag_monat') | float(0) * 12) | round(2) }}

      - name: "Ergebnis Jahresende Prognose"
        unique_id: ergebnis_jahresende_prognose
        unit_of_measurement: "€"
        device_class: monetary
        availability: "{{ states('sensor.netzbezug_kwh_jahr') | is_number }}"
        state: >
          {{ (states('sensor.abschlag_jahr_gesamt') | float(0) - states('sensor.kosten_jahr_prognose_winter') | float(0)) | round(2) }}

      - name: "Abschlag empfohlen"
        unique_id: abschlag_empfohlen
        unit_of_measurement: "€/Monat"
        availability: "{{ states('sensor.netzbezug_kwh_jahr') | is_number }}"
        state: >
          {% set rest = [12 - now().month, 1] | max %}
          {{ ((states('sensor.kosten_jahr_prognose_winter') | float(0) - states('sensor.abschlag_jahr_bezahlt') | float(0)) / rest) | round(0) | int }}

      - name: "Saldo Jahr"
        unique_id: saldo_jahr
        unit_of_measurement: "€"
        device_class: monetary
        availability: "{{ states('sensor.netzbezug_kwh_jahr') | is_number and states('sensor.einspeisung_jahr_kwh') | is_number }}"
        state: >
          {{ (states('sensor.netzbezug_jahr_kosten') | float(0) - states('sensor.einspeisung_jahr_verguetung') | float(0)) | round(2) }}

  - binary_sensor:
      - name: "PV Laden Freigabe"
        unique_id: pv_laden_freigabe
        delay_on: "00:02:00"
        delay_off: "00:05:00"
        state: >
          {% set s = states('sensor.pv_ueberschuss_wallbox') | float(0) %}
          {% if is_state('binary_sensor.pv_laden_freigabe', 'on') %}
            {{ s >= 3800 }}
          {% else %}
            {{ s >= 4300 }}
          {% endif %}

      # Störungserkennung Kostal – Logik in custom_templates/kostal.jinja
      - name: "Kostal Störung"
        unique_id: kostal_stoerung
        device_class: problem
        delay_on: "00:02:00"
        state: >
          {% from 'kostal.jinja' import kostal_stoerungen %}
          {{ kostal_stoerungen() | trim != '' }}
        attributes:
          gruende: >
            {% from 'kostal.jinja' import kostal_stoerungen %}
            {{ kostal_stoerungen() | trim }}

      - name: "Tibber Laden Freigabe"
        unique_id: tibber_laden_freigabe
        state: >
